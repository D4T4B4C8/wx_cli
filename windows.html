pre {

<script>
/* Data Vault Structures */
const cliData = [
  { title: "Miller", content: "mlr --csv cat file.csv" },
  { title: "jq", content: "jq '.name' file.json" },
  { title: "grep", content: "grep -R 'password' ." }
];

const netData = [
  { title: "Nmap", content: "nmap -sV 192.168.1.1" },
  { title: "Ping", content: "ping google.com" }
];

const linuxData = [
  { title: "Find", content: "find / -name test.txt" },
  { title: "lsblk", content: "lsblk -f" }
];

const webData = [
  { title: "Flexbox", content: "display:flex;" },
  { title: "Grid", content: "display:grid;" }
];

/* Window System Mechanics */
let z = 100;

function openWindow(title, data) {
  let win = document.createElement("div");
  win.className = "window";
  win.style.left = 260 + Math.random() * 200 + "px";
  win.style.top = 100 + Math.random() * 100 + "px";

  win.innerHTML = `
    <div class="titlebar">
      <span>${title}</span>
      <span class="close">✕</span>
    </div>
    <div class="content">
      ${data.map(item => `
        <div class="note">
          <h3>${item.title}</h3>
          <pre>${item.content}</pre>
        </div>
      `).join("")}
    </div>
  `;

  document.body.appendChild(win);

  win.querySelector(".close").onclick = () => {
    win.remove();
  };

  drag(win);
}

/* Window Drag Mechanics */
function drag(el) {
  const title = el.querySelector(".titlebar");
  let x = 0, y = 0, px = 0, py = 0;

  title.onmousedown = (e) => {
    // Bring window to top of active document stacks
    el.style.zIndex = ++z;
    px = e.clientX;
    py = e.clientY;

    document.onmousemove = (e) => {
      x = px - e.clientX;
      y = py - e.clientY;
      px = e.clientX;
      py = e.clientY;

      el.style.top = (el.offsetTop - y) + "px";
      el.style.left = (el.offsetLeft - x) + "px";
    };

    document.onmouseup = () => {
      document.onmousemove = null;
    };
  };
}

/* ========================================================================= */
/* Canvas Orbital Background Implementation                                  */
/* ========================================================================= */

window.requestAnimFrame = (function() {
  return window.requestAnimationFrame ||
         window.webkitRequestAnimationFrame ||
         window.mozRequestAnimationFrame ||
         window.oRequestAnimationFrame ||
         window.msRequestAnimationFrame ||
         function(callback) {
           window.setTimeout(callback, 1000 / 60);
         };
})();

document.onselectstart = function() {
  return false;
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;

let cw = window.innerWidth;
let ch = window.innerHeight;
canvas.width = cw * dpr;
canvas.height = ch * dpr;
ctx.scale(dpr, dpr);

function rand(rMin, rMax) {
  return Math.floor(Math.random() * (rMax - rMin + 1)) + rMin;
}

ctx.lineCap = 'round';
let orbs = [];
let trail = true;

function createOrb(mx, my) {
  const dx = (cw / 2) - mx;
  const dy = (ch / 2) - my;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const baseAngle = Math.atan2(dy, dx);
  
  const isRed = Math.random() > 0.5;
  const orbColor = isRed ? 'rgba(245, 73, 39, 1)' : 'rgba(255, 255, 255, 1)';

  orbs.push({
    x: mx,
    y: my,
    lastX: mx,
    lastY: my,
    color: orbColor,
    angle: baseAngle + Math.PI / 2,
    size: rand(1, 3) / 2,
    centerX: cw / 2,
    centerY: ch / 2,
    radius: dist,
    speed: (rand(5, 10) / 1000) * (dist / 750) + 0.015,
    update() {
      this.lastX = this.x;
      this.lastY = this.y;
      this.x = this.centerX + Math.sin(this.angle * -1) * this.radius;
      this.y = this.centerY + Math.cos(this.angle * -1) * this.radius;
      this.angle += this.speed;
    },
    draw() {
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.size;
      ctx.beginPath();
      ctx.moveTo(this.lastX, this.lastY);
      ctx.lineTo(this.x, this.y);
      ctx.stroke();
    }
  });
}

// User interactions mapping
function onMouseDown(e) {
  // Only spawn background trails if user didn't click inside active sidebar, topbar, or panels
  if (e.target.closest('.sidebar') || e.target.closest('.topbar') || e.target.closest('.window')) {
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  createOrb(mx, my);
  window.addEventListener('mousemove', onMouseMove);
}

function onMouseMove(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  createOrb(mx, my);
}

function onMouseUp() {
  window.removeEventListener('mousemove', onMouseMove);
}

window.addEventListener('mousedown', onMouseDown);
window.addEventListener('mouseup', onMouseUp);

// Initial system generation loop
let count = 100;
while (count--) {
  createOrb(cw / 2, ch / 2 + (count * 2));
}

function loop() {
  requestAnimFrame(loop);
  if (trail) {
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    ctx.fillRect(0, 0, cw, ch);
  } else {
    ctx.clearRect(0, 0, cw, ch);
  }
  for (let i = 0; i < orbs.length; i++) {
    for (let j = 0; j < 3; j++) {
      orbs[i].update();
      orbs[i].draw();
    }
  }
}
loop();

window.addEventListener('resize', function() {
  cw = window.innerWidth;
  ch = window.innerHeight;
  canvas.width = cw * dpr;
  canvas.height = ch * dpr;
  ctx.scale(dpr, dpr);
});
</script>
