<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Vault - Exclusive Liquid Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">

<style>
:root{
    /* THEME VARIABLE CONTROL */
    --accent:#de85ff;
    --bg:#050505;
    --panel:#090909;
    --border:var(--accent);
    --text:#FFFFFF;
    --glow:var(--accent);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    background:var(--bg);
    overflow:hidden;
    color:var(--text);
    height:100vh;
}

/* --- THE BLACKOUT HOLE-PUNCH COVER CANVAS --- */
#c {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 99999; /* Sits on top of EVERYTHING to hide the UI elements */
    pointer-events: none; /* Allows mouse clicks and drags to pass right through the curtain */
}

/* Animated Grid (Placed underneath the cover layer) */
.grid{
    position:fixed;
    inset:0;
    background:
    linear-gradient(rgba(94,255,247,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,157,0,.08) 1px, transparent 1px);
    background-size:40px 40px;
    animation:gridmove 20s linear infinite;
    z-index: 1;
}

@keyframes gridmove{
    from{transform:translateY(0);}
    to{transform:translateY(40px);}
}

/* Sidebar */
.sidebar{
    position:fixed;
    left:10px;
    top:10px;
    bottom:10px;
    width:220px;
    background:rgba(0,0,0,.85);
    border:1px solid var(--border);
    padding:15px;
    z-index:5;
}

.logo{
    font-size:20px;
    margin-bottom:20px;
    font-weight:bold;
}

.menu button{
    width:100%;
    margin-bottom:8px;
    padding:10px;
    background:black;
    border:1px solid var(--border);
    color:var(--text);
    cursor:pointer;
}

.menu button:hover{
    box-shadow:0 0 15px var(--glow);
}

/* Top Bar */
.topbar{
    position:fixed;
    left:250px;
    right:20px;
    top:10px;
    height:60px;
    background:rgba(0,0,0,.8);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 20px;
    z-index:5;
}

/* Windows */
.window{
    position:absolute;
    background:rgba(0,0,0,.95);
    border:1px solid var(--border);
    box-shadow:0 0 15px rgba(245, 73, 39, 0.2);
    width:500px;
    height:350px;
    z-index:10;
}

.titlebar{
    height:35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 10px;
    border-bottom:1px solid var(--border);
    cursor:move;
}

.close{
    cursor:pointer;
}

.content{
    padding:15px;
    height:calc(100% - 35px);
    overflow:auto;
}

.note{
    margin-bottom:15px;
    padding:10px;
    border:1px solid rgba(245, 73, 39, 0.2);
}

.note h3{
    margin-bottom:10px;
}

pre{
    white-space:pre-wrap;
    color:#ffd38a;
}

/* Particles */
.particle{
    position:fixed;
    width:2px;
    height:2px;
    background:var(--border);
    opacity:.4;
    animation:float linear infinite;
    z-index: 2;
}

@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-100px);}
}

#matrix{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:.10;
    pointer-events:none;
}

#network{
    position:fixed;
    top:0;
    left:240px;
    right:0;
    bottom:0;
    pointer-events:none;
    z-index:3;
}
#quote{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:4;

    font-family:'Wallpoet',cursive;
    color:#28A6F7;

    text-align:center;
    pointer-events:none;
    user-select:none;
}

#quote div{
    font-size:110px;
    line-height:1.15;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<canvas id="matrix"></canvas>
<canvas id="network"></canvas>
<div id="quote">
    <div>> The shell remembers</div>
    <div>what the GUI forgets</div>
</div>
<div class="grid"></div>

<div class="sidebar">
    <div class="logo">KNOWLEDGE VAULT</div>
    <div class="menu">
    	<button onclick="window.location.href='cli_tool.html'">

    	</button>
        <button onclick="window.location.href='convert.html'">

        </button>

        </button>

        </button>
        <button onclick="window.location.href='scanning.html'">
        SCANNING
        </button>
        <button onclick="window.location.href='transferfiles.html'">
        TRANSFER FILES
        </button>
    </div>
</div>

<div class="topbar">
    <h2>WHITEX DATABASE</h2>
</div>

<script>
/* --- WEBGL REVEAL SHADER SYSTEM --- */
const webglCanvas = document.getElementById('c');
const gl = webglCanvas.getContext('webgl');

const vs = `
attribute vec2 p;
varying vec2 uv;
void main(){
    uv = p * .5 + .5;
    gl_Position = vec4(p, 0., 1.);
}`;

const fs = `
precision highp float;

uniform vec2 vel;
varying vec2 uv;
uniform vec2 r, m;
uniform float t;
uniform vec3 accentColor;

float hash(vec2 p){
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}

float noise(vec2 p){
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(
        mix(hash(i), hash(i + vec2(1., 0.)), f.x),
        mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), f.x),
        f.y
    );
}

float fbm(vec2 p){
    float v = 0.0;
    float a = 0.5;
    for(int i = 0; i < 6; i++){
        v += noise(p) * a;
        p *= 2.0;
        a *= 0.5;
    }
    return v;
}

float metaball(vec2 p, vec2 c, float r){
    float d = length(p - c);
    return (r * r) / (d * d + 0.0005);
}

void main(){
    vec2 p = (gl_FragCoord.xy - r * 0.5) / r.y;
    vec2 cursor = vec2((m.x - 0.5) * 2.0, (m.y - 0.5) * 2.0);

    vec2 center = vec2(cursor.x * 1.0, cursor.y * 0.5) + vec2(sin(t * 2.0) * 0.02, cos(t * 1.7) * 0.02);
    float speed = length(vel);

    vec2 stretch = normalize(vel + 0.0001) * speed * 30.0;
    float blob = 0.0;

    blob += metaball(p, center - stretch * 1.5, 0.06);
    blob += metaball(p, center - stretch * 2.5, 0.04);
    blob += metaball(p, center + vec2(sin(t * 0.8) * 0.18, cos(t * 0.7) * 0.12), 0.11);
    blob += metaball(p, center + vec2(cos(t * 1.1) * 0.15, sin(t * 0.9) * 0.16), 0.09);
    blob += metaball(p, center + vec2(sin(t * 1.4) * 0.10, cos(t * 1.2) * 0.18), 0.08);
    blob += metaball(p, center + vec2(sin(t * 1.8) * 0.12, cos(t * 1.6) * 0.09), 0.07);
    blob += metaball(p, center + vec2(cos(t * 1.5) * 0.10, sin(t * 1.7) * 0.11), 0.06);
    blob += metaball(p, center + vec2(sin(t * 2.1) * 0.08, cos(t * 1.9) * 0.08), 0.05);
    blob += metaball(p, center + vec2(cos(t * 2.3) * 0.06, sin(t * 2.0) * 0.07), 0.04);

    blob += fbm(p * 4.0 + t * 0.15) * 0.35;
    blob += fbm(p * 8.0 - t * 0.08) * 0.15;
    blob += sin(t * 1.5) * 0.08;

    float mask = smoothstep(1.35, 1.50, blob);
    float rim = smoothstep(1.15, 1.65, blob) - mask;

    // Matches the --bg variable color (#050505) to blend perfectly with page defaults
    vec3 blackoutColor = vec3(0.019, 0.019, 0.019); 
    
    // Default state: Solid dark mask obscuring everything
    vec4 finalOut = vec4(blackoutColor, 1.0);

    // CRITICAL: Wherever the blob is, drop the Alpha value down to 0.0 to create a visual viewport cutout!
    if (mask > 0.01) {
        finalOut = vec4(blackoutColor, 1.0 - mask);
    }
    
    // Apply an organic glowing edge around the window reveal boundary
    finalOut.rgb += accentColor * rim * 0.6;

    gl_FragColor = finalOut;
}`;

function sh(type, src) {
    let s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

let pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(pr);
gl.useProgram(pr);

let buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

let positionLoc = gl.getAttribLocation(pr, "p");
gl.enableVertexAttribArray(positionLoc);
gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);

// Helper function to dynamically feed your CSS theme colors directly into the cutout viewport system
function getAccentRGB() {
    const hex = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    const bigint = parseInt(hex.replace('#', ''), 16);
    return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255].map(v => v / 255);
}

/* --- SYSTEM PARTICLES --- */
for(let i=0; i<100; i++){
    let p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random()*100+"vw";
    p.style.animationDuration = (5+Math.random()*15)+"s";
    document.body.appendChild(p);
}

/* --- WORKSPACE DATA INJECTION --- */
const cliData = [{ title:"Miller", content:"mlr --csv cat file.csv" }, { title:"jq", content:"jq '.name' file.json" }, { title:"grep", content:"grep -R 'password' ." }];
const netData = [{ title:"Nmap", content:"nmap -sV 192.168.1.1" }, { title:"Ping", content:"ping google.com" }];
const linuxData = [{ title:"Find", content:"find / -name test.txt" }, { title:"lsblk", content:"lsblk -f" }];
const webData = [{ title:"Flexbox", content:"display:flex;" }, { title:"Grid", content:"display:grid;" }];

/* --- INTERACTIVE WINDOW MANAGEMENT --- */
let z = 100;
function openWindow(title, data){
    let win = document.createElement("div");
    win.className = "window";
    win.style.left = 260 + Math.random()*200+"px";
    win.style.top = 100 + Math.random()*100+"px";

    win.innerHTML = `
    <div class="titlebar">
        <span>${title}</span>
        <span class="close">✕</span>
    </div>
    <div class="content">
        ${data.map(item => `
        <div class="note">
            <h3>${item.title}</h3>
            <pre>${item.content}</pre>
        </div>
        `).join("")}
    </div>`;

    document.body.appendChild(win);
    win.querySelector(".close").onclick = () => win.remove();
    drag(win);
}

function drag(el){
    const title = el.querySelector(".titlebar");
    let x=0, y=0, px=0, py=0;
    title.onmousedown = (e) => {
        el.style.zIndex = ++z;
        px = e.clientX;
        py = e.clientY;
        document.onmousemove = (e) => {
            x = px - e.clientX;
            y = py - e.clientY;
            px = e.clientX;
            py = e.clientY;
            el.style.top = (el.offsetTop - y) + "px";
            el.style.left = (el.offsetLeft - x) + "px";
        };
        document.onmouseup = () => {
            document.onmousemove = null;
        };
    };
}

/* --- BACKGROUND GRAPH ANIMATION --- */
const netGraph = document.getElementById("network");
const nctx = netGraph.getContext("2d");
const nodes = [];

for(let i=0; i<70; i++){
    nodes.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - .5) * 0.5,
        vy: (Math.random() - .5) * 0.5
    });
}

function animateNetwork(){
    nctx.clearRect(0, 0, netGraph.width, netGraph.height);
    const accentHex = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    
    for(let a of nodes){
        a.x += a.vx;
        a.y += a.vy;

        if(a.x < 0 || a.x > netGraph.width) a.vx *= -1;
        if(a.y < 0 || a.y > netGraph.height) a.vy *= -1;

        nctx.fillStyle = accentHex;
        nctx.fillRect(a.x, a.y, 2, 2);

        for(let b of nodes){
            let dx = a.x - b.x;
            let dy = a.y - b.y;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if(dist < 140){
                nctx.strokeStyle = "rgba(255,255,255,.04)";
                nctx.beginPath();
                nctx.moveTo(a.x, a.y);
                nctx.lineTo(b.x, b.y);
                nctx.stroke();
            }
        }
    }
    requestAnimationFrame(animateNetwork);
}

/* --- PHYSICS INTERPOLATION ENGINE --- */
let mx = .5, my = .5, txm = .5, tym = .5;
let vx = 0, vy = 0;
let pmx = .5, pmy = .5;

window.addEventListener('mousemove', e => {
    txm = e.clientX / window.innerWidth;
    tym = 1 - e.clientY / window.innerHeight;
});

function resizeSystem(){
    const dpr = Math.min(window.devicePixelRatio, 2);
    webglCanvas.width = window.innerWidth * dpr;
    webglCanvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, webglCanvas.width, webglCanvas.height);

    netGraph.width = window.innerWidth;
    netGraph.height = window.innerHeight;
}
window.addEventListener('resize', resizeSystem);
resizeSystem();

/* --- WEBGL RECOLOR PIPELINE HOOK --- */
function loop(timestamp){
    mx += (txm - mx) * 0.03;
    my += (tym - my) * 0.03;

    vx = mx - pmx;
    vy = my - pmy;
    pmx = mx;
    pmy = my;

    gl.uniform2f(gl.getUniformLocation(pr, 'r'), webglCanvas.width, webglCanvas.height);
    gl.uniform2f(gl.getUniformLocation(pr, 'm'), mx, my);
    gl.uniform2f(gl.getUniformLocation(pr, 'vel'), vx, vy);
    gl.uniform1f(gl.getUniformLocation(pr, 't'), timestamp * 0.001);
    
    gl.uniform3fv(gl.getUniformLocation(pr, 'accentColor'), getAccentRGB());

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(loop);
}

// Global Launch
animateNetwork();
requestAnimationFrame(loop);
</script>

</body>
