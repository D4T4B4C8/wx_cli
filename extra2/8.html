<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Vault</title>

<style>
:root{
/* CHANGE ONLY THIS */
--accent:#87f8fa;
--bg:#050505;
--panel:#090909;
--border:var(--accent);
--text:#FFFFFF;
--glow:var(--accent);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Consolas, monospace;
}

body{
background:#000;
overflow:hidden;
color:var(--text);
height:100vh;
position: relative;
}
.sidebar{
  overflow-y:auto;
  scrollbar-width:thin;
}
/* Canvas Background */
canvas {
position: absolute;
inset: 0;
width: 100vw;
height: 100vh;
display: block;
z-index: 1;
}

/* Sidebar */
.sidebar{
position:fixed;
left:10px;
top:10px;
bottom:10px;
width:220px;
background:rgba(0,0,0,.85);
border:1px solid var(--border);
padding:15px;
z-index:5;
}

.logo{
font-size:20px;
margin-bottom:20px;
font-weight:bold;
}

.menu button{
width:100%;
margin-bottom:8px;
padding:10px;
background:black;
border:1px solid var(--border);
color:var(--text);
cursor:pointer;
}

.menu button:hover{
box-shadow:0 0 15px var(--glow);
}

/* Top Bar */
.topbar{
position:fixed;
left:250px;
right:20px;
top:10px;
height:60px;
background:rgba(0,0,0,.8);
border:1px solid var(--border);
display:flex;
align-items:center;
padding:0 20px;
z-index:5;
}

/* Windows */
.window{
position:absolute;
background:rgba(0,0,0,.95);
border:1px solid var(--border);
box-shadow:0 0 15px rgba(245,73,39,.2);
width:500px;
height:350px;
z-index:10;
}

.titlebar{
height:35px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
border-bottom:1px solid var(--border);
cursor:move;
}

.close{
cursor:pointer;
}

.content{
padding:15px;
height:calc(100% - 35px);
overflow:auto;
}

.note{
margin-bottom:15px;
padding:10px;
border:1px solid rgba(245,73,39,.2);
}

.note h3{
margin-bottom:10px;
}

pre{
white-space:pre-wrap;
color:#ffd38a;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div class="sidebar">
<div class="logo">KNOWLEDGE VAULT</div>
<div class="menu">
   <button onclick="window.location.href='ai/ollama12.html'">
   HOW TO INSTALL OLLAMA AI
   </button>
</div>
</div>

<div class="topbar">
<h2>WHITEX DATABASE</h2>
</div>

<script>
/* =========================================================================
   1. CONTINUOUS FIXED NEON RED HEXAGON PATTERN
   ========================================================================= */
const c = document.getElementById('c');
const ctx = c.getContext('2d',{alpha:false});

let w=0,h=0,dpr=1;
var dieX = 0;
var dieY = 0;

function resizeCanvas(){
  dpr=Math.max(1,Math.min(window.devicePixelRatio||1,2));
  w=window.innerWidth;
  h=window.innerHeight;
  c.style.width='100vw';
  c.style.height='100vh';
  c.width=Math.floor(w*dpr);
  c.height=Math.floor(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  if(typeof opts!=='undefined'){
    opts.cx=w/2;
    opts.cy=h/2;
    dieX=w/2/opts.len;
    dieY=h/2/opts.len;
  }

  ctx.fillStyle='black';
  ctx.fillRect(0,0,w,h);
}

var opts = {
  len: 20,
  count: 50,
  baseTime: 10,
  addedTime: 10,
  dieChance: 0.05,
  spawnChance: 1,
  sparkChance: 0.1,
  sparkDist: 10,
  sparkSize: 2,
  color: 'hsl(11,100%,light%)',  // Hardcoded to target your default red accent hue
  baseLight: 50,
  addedLight: 10,
  shadowToTimePropMult: 6,
  baseLightInputMultiplier: 0.01,
  addedLightInputMultiplier: 0.02,
  cx: w / 2,
  cy: h / 2,
  repaintAlpha: 0.05,              // Set to 0 so circuits never vanish
  hueChange: 0
};

var tick = 0;
var lines = [];
var baseRad = Math.PI * 2 / 6;

resizeCanvas();

function loop() {
  window.requestAnimationFrame(loop);
  tick++;
  
  // No longer paints trailing alpha rects, leaving drawn items permanently
  if(opts.repaintAlpha > 0) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,0,0,' + opts.repaintAlpha + ')';
    ctx.fillRect(0, 0, w, h);
  }
  
  ctx.globalCompositeOperation = 'lighter';

  if (lines.length < opts.count && Math.random() < opts.spawnChance) {
    lines.push(new Line());
  }
  lines.forEach(function(line) {
    line.step();
  });
}

function Line() {
  this.reset();
}

Line.prototype.reset = function() {
  this.x = 0;
  this.y = 0;
  this.addedX = 0;
  this.addedY = 0;
  this.rad = 0;
  this.lightInputMultiplier = opts.baseLightInputMultiplier + opts.addedLightInputMultiplier * Math.random();
  this.color = opts.color;
  this.cumulativeTime = 0;
  this.beginPhase();
};

Line.prototype.beginPhase = function() {
  this.x += this.addedX;
  this.y += this.addedY;
  this.time = 0;
  this.targetTime = (opts.baseTime + opts.addedTime * Math.random()) | 0;
  this.rad += baseRad * (Math.random() < 0.5 ? 1 : -1);
  this.addedX = Math.cos(this.rad);
  this.addedY = Math.sin(this.rad);
  if (Math.random() < opts.dieChance || this.x > dieX || this.x < -dieX || this.y > dieY || this.y < -dieY) {
    this.reset();
  }
};

Line.prototype.step = function() {
  this.time++;
  this.cumulativeTime++;
  if (this.time >= this.targetTime) {
    this.beginPhase();
  }
  var prop = this.time / this.targetTime;
  var wave = Math.sin(prop * Math.PI / 2);
  var x = this.addedX * wave;
  var y = this.addedY * wave;
  ctx.shadowBlur = prop * opts.shadowToTimePropMult;
  ctx.fillStyle = ctx.shadowColor = this.color.replace('light', opts.baseLight + opts.addedLight * Math.sin(this.cumulativeTime * this.lightInputMultiplier));
  ctx.fillRect(opts.cx + (this.x + x) * opts.len, opts.cy + (this.y + y) * opts.len, 2, 2);
  
  if (Math.random() < opts.sparkChance) {
    ctx.fillRect(
      opts.cx + (this.x + x) * opts.len + Math.random() * opts.sparkDist * (Math.random() < 0.5 ? 1 : -1) - opts.sparkSize / 2,
      opts.cy + (this.y + y) * opts.len + Math.random() * opts.sparkDist * (Math.random() < 0.5 ? 1 : -1) - opts.sparkSize / 2,
      opts.sparkSize,
      opts.sparkSize
    );
  }
};

loop();
window.addEventListener('resize', resizeCanvas, {passive:true});

/* =========================================================================
   2. WINDOW MANAGEMENT SYSTEM (from demo_cleanbg.html)
   ========================================================================= */
const cliData = [
  { title: "Miller", content: "mlr --csv cat file.csv" },
  { title: "jq", content: "jq '.name' file.json" },
  { title: "grep", content: "grep -R 'password' ." }
];

const netData = [
  { title: "Nmap", content: "nmap -sV 192.168.1.1" },
  { title: "Ping", content: "ping google.com" }
];

const linuxData = [
  { title: "Find", content: "find / -name test.txt" },
  { title: "lsblk", content: "lsblk -f" }
];

const webData = [
  { title: "Flexbox", content: "display:flex;" },
  { title: "Grid", content: "display:grid;" }
];

let z = 100;

function openWindow(title, data) {
  let win = document.createElement("div");
  win.className = "window";
  win.style.left = 260 + Math.random() * 200 + "px";
  win.style.top = 100 + Math.random() * 100 + "px";

  win.innerHTML = `
    <div class="titlebar">
      <span>${title}</span>
      <span class="close">✕</span>
    </div>
    <div class="content">
      ${data.map(item => `
        <div class="note">
          <h3>${item.title}</h3>
          <pre>${item.content}</pre>
        </div>
      `).join("")}
    </div>
  `;

  document.body.appendChild(win);

  win.querySelector(".close").onclick = () => {
    win.remove();
  };

  drag(win);
}

function drag(el) {
  const title = el.querySelector(".titlebar");
  let x = 0, y = 0, px = 0, py = 0;

  title.onmousedown = (e) => {
    el.style.zIndex = ++z;
    px = e.clientX;
    py = e.clientY;

    document.onmousemove = (e) => {
      x = px - e.clientX;
      y = py - e.clientY;
      px = e.clientX;
      py = e.clientY;
      el.style.top = (el.offsetTop - y) + "px";
      el.style.left = (el.offsetLeft - x) + "px";
    };

    document.onmouseup = () => {
      document.onmousemove = null;
    };
  };
}
</script>

</body>
</html>
