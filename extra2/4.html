<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- KV-MOBILE-JS:BEGIN -->
<script>
(function(w,d){try{
  var q="(max-width:820px), (hover:none) and (pointer:coarse) and (max-height:520px)", m=w.matchMedia(q);
  if(!m.matches) return;                       /* PC / laptop: do nothing */
  d.documentElement.className+=" kv-mobile";
  w.requestAnimationFrame=function(){return 0};
  /* if the window is resized across the breakpoint, reload to get the right mode */
  var was=m.matches, f=function(e){ if(e.matches!==was) w.location.reload(); };
  if(m.addEventListener) m.addEventListener("change",f); else if(m.addListener) m.addListener(f);
}catch(e){}})(window,document);
</script>
<!-- KV-MOBILE-JS:END -->
<title>WHITEX Knowledge Vault - Cube Edition</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
:root{
--accent:#de85ff;
--bg:#050505;
--border:var(--accent);
--text:#FFFFFF;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Consolas, monospace;
}

body{
background:var(--bg);
overflow:hidden;
color:var(--text);
height:100vh;
}

/* CUBE BACKGROUND */
#cube-bg{
position:fixed;
inset:0;
z-index:0;
pointer-events:auto;
}
.sidebar{
  overflow-y:auto;
  scrollbar-width:thin;
}
.default-animation{
width:100vw;
height:100vh;
}

.default-animation--scene{
display:grid;
width:100%;
height:100%;
perspective:99999999px;
}

.cube{
position:relative;
width:100%;
height:100%;
transform-style:preserve-3d;
transform:rotateX(-18deg) rotateY(18deg);
will-change:transform;
}

.cube-face{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(fffff,#414345,#232526);
border:1px solid rgba(166,225,197);
box-shadow:
0 0 12px rgba(166,225,197,.18),
inset 0 0 10px rgba(166,225,197,.18);
backface-visibility:visible;
}

.cube-face--top{transform:rotateX(90deg) translateZ(14px);}
.cube-face--bottom{transform:rotateX(-90deg) translateZ(14px);}
.cube-face--left{transform:rotateY(-90deg) translateZ(14px);}
.cube-face--right{transform:rotateY(90deg) translateZ(14px);}
.cube-face--front{transform:translateZ(14px);} .cube-face--back{transform:rotateY(180deg) translateZ(14px);}

/* UI */
.sidebar{
position:fixed;
left:10px;
top:10px;
bottom:10px;
width:220px;
background:rgba(0,0,0,.88);
border:1px solid var(--border);
padding:15px;
z-index:20;
backdrop-filter:blur(8px);
}

.logo{
font-size:20px;
margin-bottom:20px;
font-weight:bold;
}

.menu button{
width:100%;
margin-bottom:8px;
padding:10px;
background:black;
border:1px solid var(--border);
color:var(--text);
cursor:pointer;
}

.topbar{
position:fixed;
left:250px;
right:20px;
top:10px;
height:60px;
background:rgba(0,0,0,.88);
border:1px solid var(--border);
display:flex;
align-items:center;
padding:0 20px;
z-index:20;
backdrop-filter:blur(8px);
}

.window{
position:absolute;
background:rgba(0,0,0,.95);
border:1px solid var(--border);
width:500px;
height:350px;
z-index:30;
}

.titlebar{
height:35px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
border-bottom:1px solid var(--border);
cursor:move;
}

.content{
padding:15px;
height:calc(100% - 35px);
overflow:auto;
}

.note{
margin-bottom:15px;
padding:10px;
border:1px solid rgba(245,73,39,.2);
}

pre{white-space:pre-wrap;color:#ffd38a;}
.close{cursor:pointer;}
</style>
<!-- KV-MOBILE-CSS:BEGIN -->
<style>
@media (max-width:820px), (hover:none) and (pointer:coarse) and (max-height:520px) {

  html,body{ -webkit-text-size-adjust:100%; overflow:hidden !important; }

  /* animation + desktop-only decoration: not needed on a phone */
  canvas, #displayArea, .topbar, .window, .kv-window, .particle, .grid {
    display:none !important;
  }

  /* the topic list becomes the whole screen */
  .sidebar{
    box-sizing:border-box !important;      /* some pages have no border-box reset */
    position:fixed !important;
    top:0 !important; left:0 !important; right:0 !important; bottom:0 !important;
    width:100% !important; max-width:none !important; height:100% !important;
    margin:0 !important; border:0 !important; border-radius:0 !important;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 16px
            calc(env(safe-area-inset-bottom,0px) + 32px) !important;
    background-color:#050505 !important;
    background-image:
      linear-gradient(rgba(94,255,247,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(94,255,247,.06) 1px, transparent 1px) !important;
    background-size:40px 40px !important;
    overflow-y:auto !important;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    z-index:1000 !important;               /* above everything, below the #boot screen */
  }

  .sidebar .logo, .sidebar .kv-logo{
    font-size:20px !important;
    letter-spacing:.14em;
    text-align:center;
    padding-bottom:14px;
    margin:0 auto 18px !important;
    max-width:560px;
    border-bottom:1px solid var(--accent,#5EFFF7);
  }

  .sidebar .menu, .sidebar .kv-menu{
    max-width:560px;
    margin:0 auto;
  }

  .sidebar button{
    display:block;
    width:100% !important;
    min-height:52px;
    margin:0 0 10px !important;
    padding:14px !important;
    font-size:15px !important;
    line-height:1.4;
    border-radius:4px;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .sidebar button:active{
    box-shadow:0 0 16px var(--accent,#5EFFF7) !important;
    background:rgba(94,255,247,.12) !important;
  }

  /* boot screen of index.html: progress bar must fit the screen */
  .progress{ width:min(400px,80vw) !important; }
  .boot-text{ font-size:18px !important; text-align:center; padding:0 16px; }
}
</style>
<!-- KV-MOBILE-CSS:END -->
</head>
<body>

<div id="cube-bg">
  <div id="cubes-wrapper" class="default-animation">
    <div id="cubes-scene" class="default-animation--scene"></div>
  </div>
</div>

<div class="sidebar">
<div class="logo">KNOWLEDGE VAULT</div>
<div class="menu">
<button onclick="openWindow('Networking', netData)">NETWORKING</button>
<button onclick="openWindow('Linux', linuxData)">LINUX</button>
<button onclick="openWindow('Web Dev', webData)">WEB DEV</button>
</div>
</div>

<div class="topbar">
<h2>WHITEX DATABASE</h2>
</div>

<script>
const netData=[{title:"Nmap",content:"nmap -sV 192.168.1.1"}];
const linuxData=[{title:"Find",content:"find / -name test.txt"}];
const webData=[{title:"Flexbox",content:"display:flex;"}];

let z=100;
function openWindow(title,data){
let win=document.createElement("div");
win.className="window";
win.style.left=260+Math.random()*200+"px";
win.style.top=100+Math.random()*100+"px";
win.innerHTML=`
<div class="titlebar">
<span>${title}</span>
<span class="close">✕</span>
</div>
<div class="content">
${data.map(i=>`<div class="note"><h3>${i.title}</h3><pre>${i.content}</pre></div>`).join("")}
</div>`;
document.body.appendChild(win);
win.querySelector(".close").onclick=()=>win.remove();
drag(win);
}

function drag(el){
const title=el.querySelector(".titlebar");
let x=0,y=0,px=0,py=0;
title.onmousedown=(e)=>{
el.style.zIndex=++z;
px=e.clientX; py=e.clientY;
document.onmousemove=(e)=>{
x=px-e.clientX; y=py-e.clientY;
px=e.clientX; py=e.clientY;
el.style.top=(el.offsetTop-y)+"px";
el.style.left=(el.offsetLeft-x)+"px";
};
document.onmouseup=()=>document.onmousemove=null;
};
}

/* Cube Background */
const config={gridSize:14,maxAngle:65,radius:4};
const scene=document.getElementById("cubes-scene");

scene.style.gridTemplateColumns=`repeat(${config.gridSize},1fr)`;
scene.style.gridTemplateRows=`repeat(${config.gridSize},1fr)`;
scene.style.gap='1%';

let html='';
for(let r=0;r<config.gridSize;r++){
for(let c=0;c<config.gridSize;c++){
html+=`<div class="cube" data-row="${r}" data-col="${c}">
<div class="cube-face cube-face--top"></div>
<div class="cube-face cube-face--bottom"></div>
<div class="cube-face cube-face--left"></div>
<div class="cube-face cube-face--right"></div>
<div class="cube-face cube-face--front"></div>
<div class="cube-face cube-face--back"></div>
</div>`;
}}
scene.innerHTML=html;

function tiltAt(row,col){
document.querySelectorAll('.cube').forEach(cube=>{
const r=+cube.dataset.row;
const c=+cube.dataset.col;
const dist=Math.hypot(r-row,c-col);
const angle=dist<=config.radius?(1-dist/config.radius)*config.maxAngle:0;
gsap.to(cube,{rotateX:-angle,rotateY:angle,duration:.3,overwrite:'auto'});
});
}

scene.addEventListener('pointermove',e=>{
const rect=scene.getBoundingClientRect();
const col=(e.clientX-rect.left)/(rect.width/config.gridSize);
const row=(e.clientY-rect.top)/(rect.height/config.gridSize);
tiltAt(row,col);
});

scene.addEventListener('pointerleave',()=>{
document.querySelectorAll('.cube').forEach(c=>{
gsap.to(c,{rotateX:0,rotateY:0,duration:.6});
});
});
</script>
</body>
</html>
