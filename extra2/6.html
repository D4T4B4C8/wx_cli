<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Vault & Galaxy</title>

<style>
:root{
  /* CHANGE ONLY THIS */
  --accent:#de85ff;

  --bg:#050505;
  --panel:#090909;

  --border:var(--accent);
  --text:#FFFFFF;
  --glow:var(--accent);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Consolas, monospace;
}

body{
  background:#000;
  overflow:hidden;
  color:var(--text);
  height:100vh;
}

/* Galaxy Background Canvas Setup */
#galaxy-canvas {
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1; /* Sits perfectly behind your interactive UI layer */
  touch-action: none;
}

/* Sidebar */
.sidebar{
  position:fixed;
  left:10px;
  top:10px;
  bottom:10px;
  width:220px;
  background:rgba(0,0,0,.85);
  border:1px solid var(--border);
  padding:15px;
  z-index:5;
}

.logo{
  font-size:20px;
  margin-bottom:20px;
  font-weight:bold;
}

.menu button{
  width:100%;
  margin-bottom:8px;
  padding:10px;
  background:black;
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;
}

.menu button:hover{
  box-shadow:0 0 15px var(--glow);
}

/* Top Bar */
.topbar{
  position:fixed;
  left:250px;
  right:20px;
  top:10px;
  height:60px;
  background:rgba(0,0,0,.8);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 20px;
  z-index:5;
}

/* Windows */
.window{
  position:absolute;
  background:rgba(0,0,0,.95);
  border:1px solid var(--border);
  box-shadow:0 0 15px rgba(94,255,247,.2);
  width:500px;
  height:350px;
  z-index:10;
}

.titlebar{
  height:35px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10px;
  border-bottom:1px solid var(--border);
  cursor:move;
}

.close{
  cursor:pointer;
}

.content{
  padding:15px;
  height:calc(100% - 35px);
  overflow:auto;
}

.note{
  margin-bottom:15px;
  padding:10px;
  border:1px solid rgba(94,255,247,.2);
}

.note h3{
  margin-bottom:10px;
}

pre{
  white-space:pre-wrap;
  color:#ffd38a;
}
</style>
</head>

<body>

<canvas id="galaxy-canvas"></canvas>

<div class="sidebar">
  <div class="logo">KNOWLEDGE VAULT</div>
  <div class="menu">
    <button onclick="window.location.href='cli.html'">CLI TOOLS</button>
    <button onclick="openWindow('Networking', netData)">NETWORKING</button>
    <button onclick="openWindow('Linux', linuxData)">LINUX</button>
    <button onclick="openWindow('Web Dev', webData)">WEB DEV</button>
  </div>
</div>

<div class="topbar">
  <h2>WHITEX DATABASE</h2>
</div>

<script>
  const canvas = document.getElementById('galaxy-canvas');
  const gl = canvas.getContext('webgl', { alpha: false, premultipliedAlpha: false, antialias: false });

  if (!gl) {
    console.error("WebGL context initialization failed.");
  }

  const config = {
    focal: [0.5, 0.5],
    rotation: [1.0, 0.0],
    starSpeed: 0.5,
    density: 1.0,
    hueShift: 140.0,
    speed: 1.0,
    glowIntensity: 0.3,
    saturation: 0.0,
    mouseRepulsion: true,
    repulsionStrength: 2.0,
    twinkleIntensity: 0.3,
    rotationSpeed: 0.1,
    autoCenterRepulsion: 0.0,
    transparent: false 
  };

  const vs = `
    attribute vec2 position;
    varying vec2 vUv;
    void main() {
      vUv = position * 0.5 + 0.5;
      gl_Position = vec4(position, 0.0, 1.0);
    }
  `;

  const fs = `
    precision highp float;

    uniform float uTime;
    uniform vec3 uResolution;
    uniform vec2 uFocal;
    uniform vec2 uRotation;
    uniform float uStarSpeed;
    uniform float uDensity;
    uniform float uSpeed;
    uniform vec2 uMouse;
    uniform float uGlowIntensity;
    uniform float uMouseRepulsion;
    uniform float uTwinkleIntensity;
    uniform float uRotationSpeed;
    uniform float uRepulsionStrength;
    uniform float uMouseActiveFactor;
    uniform float uAutoCenterRepulsion;
    
    uniform sampler2D uPaletteTex;

    varying vec2 vUv;

    #define NUM_LAYER 4.0
    #define STAR_COLOR_CUTOFF 0.2
    #define COS45 0.70710678
    #define SIN45 0.70710678
    #define PERIOD 3.0

    float Hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float tri(float x) {
      return abs(fract(x) * 2.0 - 1.0);
    }

    float Star(vec2 uv, float flare) {
      float d = length(uv);
      float m = (0.04 * uGlowIntensity) / max(d, 0.001);
      
      float rays = max(0.0, 1.0 - abs(uv.x * uv.y * 800.0));
      m += rays * flare * uGlowIntensity;
      
      vec2 rotUv = vec2(uv.x * COS45 - uv.y * SIN45, uv.x * SIN45 + uv.y * COS45);
      rays = max(0.0, 1.0 - abs(rotUv.x * rotUv.y * 800.0));
      m += rays * 0.25 * flare * uGlowIntensity;
      
      return m * smoothstep(1.0, 0.2, d);
    }

    vec3 StarLayer(vec2 uv) {
      vec3 col = vec3(0.0);
      vec2 gv = fract(uv) - 0.5; 
      vec2 id = floor(uv);

      for (int y = -1; y <= 1; y++) {
        for (int x = -1; x <= 1; x++) {
          vec2 offset = vec2(float(x), float(y));
          vec2 si = id + offset;
          float seed = Hash21(si);
          float size = fract(seed * 345.32);
          float glossLocal = tri(uStarSpeed / (PERIOD * seed + 1.0));
          float flareSize = smoothstep(0.88, 1.0, size) * glossLocal;

          float red = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 1.0)) + STAR_COLOR_CUTOFF;
          float blu = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 3.0)) + STAR_COLOR_CUTOFF;
          float grn = min(red, blu) * seed;
          
          vec3 baseColor = texture2D(uPaletteTex, vec2(seed + grn, 0.5)).rgb;

          vec2 pad = vec2(
            tri(seed * 34.0 + uTime * uSpeed / 10.0), 
            tri(seed * 38.0 + uTime * uSpeed / 30.0)
          ) - 0.5;

          float star = Star(gv - offset - pad, flareSize);
          
          float twinkle = sin(uTime * uSpeed * 2.0 + seed * 6.2831) * 0.15 + 0.85;
          twinkle = mix(1.0, twinkle, uTwinkleIntensity);
          
          col += star * size * baseColor * twinkle;
        }
      }
      return col;
    }

    void main() {
      vec2 focalPx = uFocal * uResolution.xy;
      vec2 uv = (vUv * uResolution.xy - focalPx) / uResolution.y;

      vec2 centerUV = vec2(0.0);
      float centerDist = length(uv - centerUV);
      vec2 autoRepulsion = normalize(uv - centerUV) * (uAutoCenterRepulsion / (centerDist + 0.1)) * 0.05;

      vec2 mousePosUV = (uMouse * uResolution.xy - focalPx) / uResolution.y;
      float mouseDist = length(uv - mousePosUV);
      vec2 mouseRepulsionVec = normalize(uv - mousePosUV) * (uRepulsionStrength / (mouseDist + 0.1)) * 0.05 * uMouseActiveFactor;

      vec2 mouseOffset = (uMouse - vec2(0.5)) * 0.1 * uMouseActiveFactor;

      vec2 distortion = mix(mouseOffset, mouseRepulsionVec, uMouseRepulsion);
      distortion = mix(distortion, autoRepulsion, step(0.001, uAutoCenterRepulsion));
      uv += distortion;

      float autoRotAngle = uTime * uRotationSpeed;
      float cA = cos(autoRotAngle), sA = sin(autoRotAngle);
      uv = mat2(cA, -sA, sA, cA) * uv;
      uv = mat2(uRotation.x, -uRotation.y, uRotation.y, uRotation.x) * uv;

      vec3 col = vec3(0.0);

      for (float i = 0.0; i < 1.0; i += 1.0 / NUM_LAYER) {
        float depth = fract(i + uStarSpeed * uSpeed);
        float scale = mix(20.0 * uDensity, 0.5 * uDensity, depth);
        float fade = depth * smoothstep(1.0, 0.9, depth);
        col += StarLayer(uv * scale + i * 453.32) * fade;
      }

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function createPaletteTexture(hueShift, saturation) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);

    const width = 256;
    const data = new Uint8Array(width * 4);

    for (let i = 0; i < width; i++) {
      const t = i / (width - 1);
      const rad = 6.28318 * (t + (hueShift / 360.0));
      let r = 0.5 + 0.5 * Math.cos(rad);
      let g = 0.5 + 0.5 * Math.cos(rad + 2.0734);
      let b = 0.5 + 0.5 * Math.cos(rad + 4.2097);

      const gray = 0.299 * r + 0.587 * g + 0.114 * b;
      const satFactor = saturation + 0.5;
      r = gray + (r - gray) * satFactor;
      g = gray + (g - gray) * satFactor;
      b = gray + (b - gray) * satFactor;

      const idx = i * 4;
      data[idx]     = Math.max(0, Math.min(255, r * 255));
      data[idx + 1] = Math.max(0, Math.min(255, g * 255));
      data[idx + 2] = Math.max(0, Math.min(255, b * 255));
      data[idx + 3] = 255;
    }

    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return tex;
  }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(gl.getShaderInfoLog(s));
    return s;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(program);
  gl.useProgram(program);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  const pos = gl.getAttribLocation(program, 'position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

  const uniforms = {
    uTime: gl.getUniformLocation(program, 'uTime'),
    uResolution: gl.getUniformLocation(program, 'uResolution'),
    uFocal: gl.getUniformLocation(program, 'uFocal'),
    uRotation: gl.getUniformLocation(program, 'uRotation'),
    uStarSpeed: gl.getUniformLocation(program, 'uStarSpeed'),
    uDensity: gl.getUniformLocation(program, 'uDensity'),
    uSpeed: gl.getUniformLocation(program, 'uSpeed'),
    uMouse: gl.getUniformLocation(program, 'uMouse'),
    uGlowIntensity: gl.getUniformLocation(program, 'uGlowIntensity'),
    uMouseRepulsion: gl.getUniformLocation(program, 'uMouseRepulsion'),
    uTwinkleIntensity: gl.getUniformLocation(program, 'uTwinkleIntensity'),
    uRotationSpeed: gl.getUniformLocation(program, 'uRotationSpeed'),
    uRepulsionStrength: gl.getUniformLocation(program, 'uRepulsionStrength'),
    uMouseActiveFactor: gl.getUniformLocation(program, 'uMouseActiveFactor'),
    uAutoCenterRepulsion: gl.getUniformLocation(program, 'uAutoCenterRepulsion'),
    uPaletteTex: gl.getUniformLocation(program, 'uPaletteTex')
  };

  let targetMouseX = 0.5, targetMouseY = 0.5;
  let currentMouseX = 0.5, currentMouseY = 0.5;
  let targetMouseActive = 0.0, currentMouseActive = 0.0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio, 1.5);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform3f(uniforms.uResolution, canvas.width, canvas.height, canvas.width / canvas.height);
  }
  window.addEventListener('resize', resize, { passive: true });

  createPaletteTexture(config.hueShift, config.saturation);
  gl.uniform1i(uniforms.uPaletteTex, 0);

  gl.uniform2fv(uniforms.uFocal, new Float32Array(config.focal));
  gl.uniform2fv(uniforms.uRotation, new Float32Array(config.rotation));
  gl.uniform1f(uniforms.uDensity, config.density);
  gl.uniform1f(uniforms.uSpeed, config.speed);
  gl.uniform1f(uniforms.uGlowIntensity, config.glowIntensity);
  gl.uniform1f(uniforms.uMouseRepulsion, config.mouseRepulsion ? 1.0 : 0.0);
  gl.uniform1f(uniforms.uTwinkleIntensity, config.twinkleIntensity);
  gl.uniform1f(uniforms.uRotationSpeed, config.rotationSpeed);
  gl.uniform1f(uniforms.uRepulsionStrength, config.repulsionStrength);
  gl.uniform1f(uniforms.uAutoCenterRepulsion, config.autoCenterRepulsion);

  resize();

  function updateCoordinates(clientX, clientY) {
    targetMouseX = clientX / window.innerWidth;
    targetMouseY = 1.0 - (clientY / window.innerHeight);
    targetMouseActive = 1.0;
  }

  window.addEventListener('mousemove', (e) => {
    updateCoordinates(e.clientX, e.clientY);
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
      updateCoordinates(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  const handleLeave = () => { targetMouseActive = 0.0; };
  window.addEventListener('mouseleave', handleLeave, { passive: true });
  window.addEventListener('touchend', handleLeave, { passive: true });

  function render(t) {
    const timeSec = t * 0.001;
    gl.uniform1f(uniforms.uTime, timeSec);
    gl.uniform1f(uniforms.uStarSpeed, (timeSec * config.starSpeed) / 10.0);

    const lerpFactor = 0.05;
    currentMouseX += (targetMouseX - currentMouseX) * lerpFactor;
    currentMouseY += (targetMouseY - currentMouseY) * lerpFactor;
    currentMouseActive += (targetMouseActive - currentMouseActive) * lerpFactor;

    gl.uniform2f(uniforms.uMouse, currentMouseX, currentMouseY);
    gl.uniform1f(uniforms.uMouseActiveFactor, currentMouseActive);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
</script>

<script>
  const cliData = [
    { title:"Miller", content:"mlr --csv cat file.csv" },
    { title:"jq", content:"jq '.name' file.json" },
    { title:"grep", content:"grep -R 'password' ." }
  ];

  const netData = [
    { title:"Nmap", content:"nmap -sV 192.168.1.1" },
    { title:"Ping", content:"ping google.com" }
  ];

  const linuxData = [
    { title:"Find", content:"find / -name test.txt" },
    { title:"lsblk", content:"lsblk -f" }
  ];

  const webData = [
    { title:"Flexbox", content:"display:flex;" },
    { title:"Grid", content:"display:grid;" }
  ];

  let z = 100;

  function openWindow(title, data){
    let win = document.createElement("div");
    win.className = "window";
    win.style.left = 260 + Math.random() * 200 + "px";
    win.style.top = 100 + Math.random() * 100 + "px";

    win.innerHTML = `
      <div class="titlebar">
        <span>${title}</span>
        <span class="close">✕</span>
      </div>
      <div class="content">
        ${data.map(item => `
          <div class="note">
            <h3>${item.title}</h3>
            <pre>${item.content}</pre>
          </div>
        `).join("")}
      </div>
    `;

    document.body.appendChild(win);

    win.querySelector(".close").onclick = () => {
      win.remove();
    };

    drag(win);
  }

  function drag(el){
    const title = el.querySelector(".titlebar");
    let x = 0, y = 0, px = 0, py = 0;

    title.onmousedown = (e) => {
      el.style.zIndex = ++z;
      px = e.clientX;
      py = e.clientY;

      document.onmousemove = (e) => {
        x = px - e.clientX;
        y = py - e.clientY;
        px = e.clientX;
        py = e.clientY;

        el.style.top = (el.offsetTop - y) + "px";
        el.style.left = (el.offsetLeft - x) + "px";
      };

      document.onmouseup = () => {
        document.onmousemove = null;
      };
    };
  }
</script>

</body>
</html>
