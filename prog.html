    /* Window System */
    let z = 100;

    function openWindow(title,data){
    let win=document.createElement("div");
    win.className="window";
    win.style.left=260+Math.random()*200+"px";

    /* Drag */
    function drag(el){
    const title=el.querySelector(".titlebar");
    let x=0,y=0,px=0,py=0;

    title.onmousedown=(e)=>{
    el.style.zIndex=++z;
    px=e.clientX;
    py=e.clientY;

    document.onmousemove=(e)=>{
    x=px-e.clientX;
    y=py-e.clientY;
    px=e.clientX;
    py=e.clientY;

    el.style.top=(el.offsetTop-y)+"px";
    el.style.left=(el.offsetLeft-x)+"px";
    };

    document.onmouseup=()=>{
    document.onmousemove=null;
    };
    };
    }

  <script>
    // ==========================================
    // SHADER MATRIX CODE
    // ==========================================
    const vertShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    const fragShader = `
      precision highp float;
      uniform vec3 iResolution;
      uniform float iTime;
      uniform vec2 uSkew;
      uniform float uTilt;
      uniform float uYaw;
      uniform float uLineThickness;
      uniform vec3 uLinesColor;
      uniform vec3 uScanColor;
      uniform float uGridScale;
      uniform float uLineStyle;
      uniform float uLineJitter;
      uniform float uScanOpacity;
      uniform float uScanDirection;
      uniform float uNoise;
      uniform float uScanGlow;
      uniform float uScanSoftness;
      uniform float uPhaseTaper;
      uniform float uScanDuration;
      uniform float uScanDelay;
      varying vec2 vUv;

      float smoother01(float a, float b, float x){
        float t = clamp((x - a) / max(1e-5, (b - a)), 0.0, 1.0);
        return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
      }

      void mainImage(out vec4 fragColor, in vec2 fragCoord)
      {
          vec2 p = (2.0 * fragCoord - iResolution.xy) / iResolution.y;
          vec3 ro = vec3(0.0);
          vec3 rd = normalize(vec3(p, 1.3));

          float cR = cos(uTilt), sR = sin(uTilt);
          rd.xy = mat2(cR, -sR, sR, cR) * rd.xy;

          float cY = cos(uYaw), sY = sin(uYaw);
          rd.xz = mat2(cY, -sY, sY, cY) * rd.xz;

          vec2 skew = clamp(uSkew, vec2(-0.7), vec2(0.7));
          rd.xy += skew * rd.z;

          vec3 color = vec3(0.0);
          float minT = 1e20;
          float gridScale = max(1e-5, uGridScale);
          float fadeStrength = 2.0;
          vec2 gridUV = vec2(0.0);

          float hitIsY = 1.0;
          for (int i = 0; i < 4; i++)
          {
              float isY = float(i < 2);
              float pos = mix(-0.2, 0.2, float(i)) * isY + mix(-0.5, 0.5, float(i - 2)) * (1.0 - isY);
              float num = pos - (isY * ro.y + (1.0 - isY) * ro.x);
              float den = isY * rd.y + (1.0 - isY) * rd.x;
              float t = num / den;
              vec3 h = ro + rd * t;

              float depthBoost = smoothstep(0.0, 3.0, h.z);
              h.xy += skew * 0.15 * depthBoost;

              bool use = t > 0.0 && t < minT;
              gridUV = use ? mix(h.zy, h.xz, isY) / gridScale : gridUV;
              minT = use ? t : minT;
              hitIsY = use ? isY : hitIsY;
          }

          vec3 hit = ro + rd * minT;
          float dist = length(hit - ro);

          float jitterAmt = clamp(uLineJitter, 0.0, 1.0);
          if (jitterAmt > 0.0) {
            vec2 j = vec2(
              sin(gridUV.y * 2.7 + iTime * 1.8),
              cos(gridUV.x * 2.3 - iTime * 1.6)
            ) * (0.15 * jitterAmt);
            gridUV += j;
          }
          float fx = fract(gridUV.x);
          float fy = fract(gridUV.y);
          float ax = min(fx, 1.0 - fx);
          float ay = min(fy, 1.0 - fy);
          float wx = fwidth(gridUV.x);
          float wy = fwidth(gridUV.y);
          float halfPx = max(0.0, uLineThickness) * 0.5;

          float tx = halfPx * wx;
          float ty = halfPx * wy;
          float aax = wx;
          float aay = wy;

          float lineX = 1.0 - smoothstep(tx, tx + aax, ax);
          float lineY = 1.0 - smoothstep(ty, ty + aay, ay);
          float primaryMask = max(lineX, lineY);

          vec2 gridUV2 = (hitIsY > 0.5 ? hit.xz : hit.zy) / gridScale;
          if (jitterAmt > 0.0) {
            vec2 j2 = vec2(
              cos(gridUV2.y * 2.1 - iTime * 1.4),
              sin(gridUV2.x * 2.5 + iTime * 1.7)
            ) * (0.15 * jitterAmt);
            gridUV2 += j2;
          }
          float fx2 = fract(gridUV2.x);
          float fy2 = fract(gridUV2.y);
          float ax2 = min(fx2, 1.0 - fx2);
          float ay2 = min(fy2, 1.0 - fy2);
          float wx2 = fwidth(gridUV2.x);
          float wy2 = fwidth(gridUV2.y);
          float tx2 = halfPx * wx2;
          float ty2 = halfPx * wy2;
          float aax2 = wx2;
          float aay2 = wy2;
          float lineX2 = 1.0 - smoothstep(tx2, tx2 + aax2, ax2);
          float lineY2 = 1.0 - smoothstep(ty2, ty2 + aay2, ay2);
          float altMask = max(lineX2, lineY2);

          float edgeDistX = min(abs(hit.x - (-0.5)), abs(hit.x - 0.5));
          float edgeDistY = min(abs(hit.y - (-0.2)), abs(hit.y - 0.2));
          float edgeDist = mix(edgeDistY, edgeDistX, hitIsY);
          float edgeGate = 1.0 - smoothstep(gridScale * 0.5, gridScale * 2.0, edgeDist);
          altMask *= edgeGate;

          float lineMask = max(primaryMask, altMask);
          float fade = exp(-dist * fadeStrength);

          float dur = max(0.05, uScanDuration);
          float del = max(0.0, uScanDelay);
          float scanZMax = 2.0;
          float widthScale = max(0.1, uScanGlow);
          float sigma = max(0.001, 0.18 * widthScale * uScanSoftness);
          float sigmaA = sigma * 2.0;

          float combinedPulse = 0.0;
          float combinedAura = 0.0;

          float cycle = dur + del;
          float tCycle = mod(iTime, cycle);
          float scanPhase = clamp((tCycle - del) / dur, 0.0, 1.0);
          float phase = scanPhase;
          
          if (uScanDirection > 0.5 && uScanDirection < 1.5) {
            phase = 1.0 - phase;
          } else if (uScanDirection > 1.5) {
            float t2 = mod(max(0.0, iTime - del), 2.0 * dur);
            phase = (t2 < dur) ? (t2 / dur) : (1.0 - (t2 - dur) / dur);
          }
          
          float scanZ = phase * scanZMax;
          float dz = abs(hit.z - scanZ);
          float lineBand = exp(-0.5 * (dz * dz) / (sigma * sigma));
          float taper = clamp(uPhaseTaper, 0.0, 0.49);
          float headW = taper;
          float tailW = taper;
          float headFade = smoother01(0.0, headW, phase);
          float tailFade = 1.0 - smoother01(1.0 - tailW, 1.0, phase);
          float phaseWindow = headFade * tailFade;
          float pulseBase = lineBand * phaseWindow;
          combinedPulse += pulseBase * clamp(uScanOpacity, 0.0, 1.0);
          float auraBand = exp(-0.5 * (dz * dz) / (sigmaA * sigmaA));
          combinedAura += (auraBand * 0.25) * phaseWindow * clamp(uScanOpacity, 0.0, 1.0);

          vec3 gridCol = uLinesColor * lineMask * fade;
          vec3 scanCol = uScanColor * combinedPulse;
          vec3 scanAura = uScanColor * combinedAura;

          vec3 glow =
              uScanColor *
              pow(max(0.0, 1.0 - dist * 0.12), 3.0) *
              0.15;
          
          color =
              gridCol +
              scanCol +
              scanAura +
              glow;

          float n = fract(sin(dot(gl_FragCoord.xy + vec2(iTime * 123.4), vec2(12.9898,78.233))) * 43758.5453123);
          color += (n - 0.5) * uNoise;
          color = clamp(color, 0.0, 1.0);
          
          float alpha = clamp(max(lineMask, combinedPulse), 0.0, 1.0);
          fragColor = vec4(color, alpha);
      }

      void main(){
        vec4 c;
        mainImage(c, vUv * iResolution.xy);
        gl_FragColor = c;
      }
    `;

    // ==========================================
    // SEAMLESS APPLICATION RUNNER
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('canvas-target');
      
      // Setup Engine Core
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
      );
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      // Interpolation Targets
      const lookTarget = new THREE.Vector2(0, 0);
      const lookCurrent = new THREE.Vector2(0, 0);
      const lookVelocity = new THREE.Vector2(0, 0);

      // Environment Parameter Configuration
      const config = {
        sensitivity: 1.0,
        lineThickness: 1.6,
        linesColor: "#ff1837",
        scanColor: "#a7e0f6",
        gridScale: 0.06,
        lineJitter: 0.18,
        scanOpacity: 0.75,
        noiseIntensity: 0.02,
        scanGlow: 1.5,
        scanSoftness: 2.5,
        scanPhaseTaper: 0.95,
        scanDuration: 2.2,
        scanDelay: 1.2,
        snapBackDelay: 150
      };

      // Configuration Mappings
      const s = Math.min(1, Math.max(0, config.sensitivity));
      const skewScale = THREE.MathUtils.lerp(0.06, 0.2, s);
      const smoothTime = THREE.MathUtils.lerp(0.45, 0.12, s);

      const parseColor = (hex) => {
        const c = new THREE.Color(hex);
        return c.convertSRGBToLinear();
      };

      // Uniform Context
      const uniforms = {
        iResolution: { value: new THREE.Vector3(container.clientWidth, container.clientHeight, renderer.getPixelRatio()) },
        iTime: { value: 0 },
        uSkew: { value: new THREE.Vector2(0, 0) },
        uTilt: { value: 0.0 },
        uYaw: { value: 0.0 },
        uLineThickness: { value: config.lineThickness },
        uLinesColor: { value: parseColor(config.linesColor) },
        uScanColor: { value: parseColor(config.scanColor) },
        uGridScale: { value: config.gridScale },
        uLineStyle: { value: 0.0 }, // Solid
        uLineJitter: { value: config.lineJitter },
        uScanOpacity: { value: config.scanOpacity },
        uScanDirection: { value: 2.0 }, // Pingpong
        uNoise: { value: config.noiseIntensity },
        uScanGlow: { value: config.scanGlow },
        uScanSoftness: { value: config.scanSoftness },
        uPhaseTaper: { value: config.scanPhaseTaper },
        uScanDuration: { value: config.scanDuration },
        uScanDelay: { value: config.scanDelay }
      };

      const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: vertShader,
        fragmentShader: fragShader,
        transparent: true,
        depthWrite: false,
        depthTest: false
      });

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
      scene.add(quad);

      // Event Listeners for Matrix Skewing
      let leaveTimer = null;

      container.addEventListener('mousemove', (e) => {
        if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = null; }
        const rect = container.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        const y = -(((e.clientY - rect.top) / rect.height) * 2 - 1);
        lookTarget.set(x, y);
      });

      container.addEventListener('mouseleave', () => {
        if (leaveTimer) clearTimeout(leaveTimer);
        leaveTimer = setTimeout(() => {
          lookTarget.set(0, 0);
        }, config.snapBackDelay);
      });

      window.addEventListener('resize', () => {
        renderer.setSize(container.clientWidth, container.clientHeight);
        uniforms.iResolution.value.set(container.clientWidth, container.clientHeight, renderer.getPixelRatio());
      });

      // Smooth Animation Interpolator (SmoothDamp implementation)
      function smoothDampVec2(current, target, currentVelocity, smoothTime, deltaTime) {
        smoothTime = Math.max(0.0001, smoothTime);
        const omega = 2 / smoothTime;
        const x = omega * deltaTime;
        const exp = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
        
        let changeX = current.x - target.x;
        let changeY = current.y - target.y;
        
        const tempX = (currentVelocity.x + omega * changeX) * deltaTime;
        const tempY = (currentVelocity.y + omega * changeY) * deltaTime;
        
        currentVelocity.x = (currentVelocity.x - omega * tempX) * exp;
        currentVelocity.y = (currentVelocity.y - omega * tempY) * exp;
        
        current.x = target.x + (changeX + tempX) * exp;
        current.y = target.y + (changeY + tempY) * exp;
        
        return current;
      }

      // Main Loop Execution
      let lastTime = performance.now();
      
      const animate = () => {
        const now = performance.now();
        const dt = Math.max(0, Math.min(0.1, (now - lastTime) / 1000));
        lastTime = now;

        smoothDampVec2(lookCurrent, lookTarget, lookVelocity, smoothTime, dt);

        // Map look updates directly into GLSL matrices
        uniforms.uSkew.value.set(
          lookCurrent.x * 0.22,
          -lookCurrent.y * 0.22
        );
        
        uniforms.uYaw.value =
          lookCurrent.x * 0.55 +
          Math.sin(now * 0.00025) * 0.08;
        
        uniforms.uTilt.value =
          lookCurrent.y * 0.25 +
          Math.cos(now * 0.0002) * 0.05;
          
        uniforms.iTime.value = now / 1000;

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      };

      requestAnimationFrame(animate);
    });
  </script>
