<script>
(function(w,d){try{
  var q="(max-width:820px), (hover:none) and (pointer:coarse) and (max-height:520px)", m=w.matchMedia(q);
  if(!m.matches) return;                       /* PC / laptop: do nothing */
  d.documentElement.className+=" kv-mobile";
  w.requestAnimationFrame=function(){return 0};
  /* if the window is resized across the breakpoint, reload to get the right mode */
  var was=m.matches, f=function(e){ if(e.matches!==was) w.location.reload(); };
  if(m.addEventListener) m.addEventListener("change",f); else if(m.addListener) m.addListener(f);
}catch(e){}})(window,document);
</script>

<script>
/* Data Vault */
const cliData = [
  { title:"Miller", content:"mlr --csv cat file.csv" },
  { title:"jq", content:"jq '.name' file.json" },
  { title:"grep", content:"grep -R 'password' ." }
];

const netData = [
  { title:"Nmap", content:"nmap -sV 192.168.1.1" },
  { title:"Ping", content:"ping google.com" }
];

const linuxData = [
  { title:"Find", content:"find / -name test.txt" },
  { title:"lsblk", content:"lsblk -f" }
];

const webData = [
  { title:"Flexbox", content:"display:flex;" },
  { title:"Grid", content:"display:grid;" }
];

/* Window System */
let z = 100;

function openWindow(title, data){
  let win = document.createElement("div");
  win.className = "window";
  win.style.left = 260 + Math.random() * 200 + "px";
  win.style.top = 100 + Math.random() * 100 + "px";

  win.innerHTML = `
    <div class="titlebar">
      <span>${title}</span>
      <span class="close">✕</span>
    </div>
    <div class="content">
      ${data.map(item => `
        <div class="note">
          <h3>${item.title}</h3>
          <pre>${item.content}</pre>
        </div>
      `).join("")}
    </div>
  `;

  document.body.appendChild(win);

  // Focus window on choice
  win.style.zIndex = ++z;
  win.addEventListener('mousedown', () => {
    win.style.zIndex = ++z;
  });

  win.querySelector(".close").onclick = () => {
    win.remove();
  };

  drag(win);
}

/* Drag Windows */
function drag(el){
  const title = el.querySelector(".titlebar");
  let x = 0, y = 0, px = 0, py = 0;

  title.onmousedown = (e) => {
    el.style.zIndex = ++z;
    px = e.clientX;
    py = e.clientY;

    document.onmousemove = (e) => {
      x = px - e.clientX;
      y = py - e.clientY;
      px = e.clientX;
      py = e.clientY;

      el.style.top = (el.offsetTop - y) + "px";
      el.style.left = (el.offsetLeft - x) + "px";
    };

    document.onmouseup = () => {
      document.onmousemove = null;
    };
  };
}

/* Cyberpunk Fiber Optics Engine */
const canvas = document.querySelector('.optic-canvas');
const ctx = canvas.getContext('2d');
let width, height, centerX, centerY;
let particles = [];

const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
const config = {
  particleCount: 800, 
  maxDepth: 1000,
  baseSpeed: 4,
  twistFactor: 0.002 
};

function setSize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  centerX = width / 2;
  centerY = height / 2;
}

class Particle {
  constructor() {
    this.reset(true);
  }
  
  reset(initPhase = false) {
    this.z = initPhase ? Math.random() * config.maxDepth : config.maxDepth;
    this.angle = Math.random() * Math.PI * 2;
    this.radius = 40 + Math.random() * 80; 
    this.speed = config.baseSpeed + Math.random() * 4;
    this.hue = Math.random() > 0.45 ? 185 + Math.random() * 30 : 290 + Math.random() * 30;
  }
  
  update() {
    this.z -= this.speed;
    this.angle += config.twistFactor * (this.speed * 0.5);
    if (this.z <= 1) {
      this.reset(false);
    }
  }
  
  draw() {
    const fov = 400;
    const scale = fov / this.z;
    
    const currentCenterX = centerX + mouse.x * (config.maxDepth - this.z) * 0.15;
    const currentCenterY = centerY + mouse.y * (config.maxDepth - this.z) * 0.15;

    const x2d = (Math.cos(this.angle) * this.radius) * scale + currentCenterX;
    const y2d = (Math.sin(this.angle) * this.radius) * scale + currentCenterY;
    
    const prevScale = fov / (this.z + this.speed * 3);
    const prevX2d = (Math.cos(this.angle - config.twistFactor) * this.radius) * prevScale + currentCenterX;
    const prevY2d = (Math.sin(this.angle - config.twistFactor) * this.radius) * prevScale + currentCenterY;

    if (x2d < 0 || x2d > width || y2d < 0 || y2d > height) return;

    const alpha = (1 - this.z / config.maxDepth) * 0.9;
    
    ctx.beginPath();
    ctx.moveTo(prevX2d, prevY2d);
    ctx.lineTo(x2d, y2d);
    
    ctx.lineWidth = scale * 0.8;
    ctx.strokeStyle = `hsla(${this.hue}, 95%, 65%, ${alpha})`;
    ctx.stroke();
  }
}

function init() {
  setSize();
  particles = [];
  for (let i = 0; i < config.particleCount; i++) {
    particles.push(new Particle());
  }
}

function animate() {
  ctx.fillStyle = 'rgba(5, 5, 12, 0.15)';
  ctx.fillRect(0, 0, width, height);

  mouse.x += (mouse.targetX - mouse.x) * 0.08;
  mouse.y += (mouse.targetY - mouse.y) * 0.08;

  particles.sort((a, b) => b.z - a.z);

  particles.forEach(p => {
    p.update();
    p.draw();
  });
  
  requestAnimationFrame(animate);
}

function handleMove(e) {
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  mouse.targetX = (clientX - width / 2) / (width / 2);
  mouse.targetY = (clientY - height / 2) / (height / 2);
}

window.addEventListener('resize', () => {
  init();
});

window.addEventListener('mousemove', handleMove);
window.addEventListener('touchmove', handleMove, { passive: true });

window.addEventListener('mouseleave', () => {
  mouse.targetX = 0;
  mouse.targetY = 0;
});

init();
animate();
</script>
