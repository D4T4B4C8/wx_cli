<script>
(function(w,d){try{
  var q="(max-width:820px), (hover:none) and (pointer:coarse) and (max-height:520px)", m=w.matchMedia(q);
  if(!m.matches) return;                       /* PC / laptop: do nothing */
  d.documentElement.className+=" kv-mobile";
  w.requestAnimationFrame=function(){return 0};
  /* if the window is resized across the breakpoint, reload to get the right mode */
  var was=m.matches, f=function(e){ if(e.matches!==was) w.location.reload(); };
  if(m.addEventListener) m.addEventListener("change",f); else if(m.addListener) m.addListener(f);
}catch(e){}})(window,document);
</script>

/* ── Top Bar ── */

.topbar {

  left: 250px;
  right: 20px;
  top: 10px;
  height: 60px;
  background: rgba(0, 0, 0, .7);
  border: 1px solid var(--border);

  backdrop-filter: blur(6px);
}

/* ── Floating Windows ── */

.window {
  position: absolute;
  background: rgba(0, 0, 0, .92);
  border: 1px solid var(--border);
  box-shadow: 0 0 20px rgba(245, 73, 39, .25);
  width: 500px;
  height: 350px;
  z-index: 10;
  backdrop-filter: blur(8px);
}

.titlebar {
  height: 35px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 10px;
  border-bottom: 1px solid var(--border);
  cursor: move;
  user-select: none;
}

.close {
  cursor: pointer;
}

.close:hover {
  opacity: .7;
}

.content {
  padding: 15px;
  height: calc(100% - 35px);
  overflow: auto;
}

.note {
  margin-bottom: 15px;
  padding: 10px;
  border: 1px solid rgba(245, 73, 39, .25);
}

.note h3 {
  margin-bottom: 10px;
}

pre {
  white-space: pre-wrap;
  color: #ffd38a;
}

</style>

<script>

/* ── Window system ── */

let z = 100;

function openWindow(title, data) {
  const win = document.createElement('div');
  win.className = 'window';
  win.style.left = (260 + Math.random() * 200) + 'px';
  win.style.top  = (80  + Math.random() * 120) + 'px';

  win.innerHTML = `
    <div class="titlebar">
      <span>${title}</span>
      <span class="close">✕</span>
    </div>
    <div class="content">
      ${data.map(item => `
        <div class="note">
          <h3>${item.title}</h3>
          <pre>${item.content}</pre>
        </div>
      `).join('')}
    </div>
  `;

  document.body.appendChild(win);
  win.querySelector('.close').onclick = () => win.remove();
  drag(win);
}

/* ── Drag ── */

function drag(el) {
  const bar = el.querySelector('.titlebar');
  let x = 0, y = 0, px = 0, py = 0;

  bar.onmousedown = e => {
    el.style.zIndex = ++z;
    px = e.clientX;
    py = e.clientY;

    document.onmousemove = e => {
      x = px - e.clientX;
      y = py - e.clientY;
      px = e.clientX;
      py = e.clientY;
      el.style.top  = (el.offsetTop  - y) + 'px';
      el.style.left = (el.offsetLeft - x) + 'px';
    };

    document.onmouseup = () => { document.onmousemove = null; };
  };
}
