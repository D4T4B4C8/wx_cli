<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Vault</title>

<style>

:root{

/* CHANGE ONLY THIS */
--accent:#90e3fc;

--bg:#050505;
--panel:#090909;

--border:var(--accent);
--text:#FFFFFF;
--glow:var(--accent);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Consolas, monospace;
}

body{
background:var(--bg);
overflow:hidden;
color:var(--text);
height:100vh;
}
.sidebar{
  overflow-y:auto;
  scrollbar-width:thin;
}
/* Animated Grid */

.grid{
position:fixed;
inset:0;
background:
linear-gradient(rgba(94,255,247,.08) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,157,0,.08) 1px, transparent 1px);
background-size:40px 40px;
animation:gridmove 20s linear infinite;
}

@keyframes gridmove{
from{transform:translateY(0);}
to{transform:translateY(40px);}
}


/* Sidebar */

.sidebar{
position:fixed;
left:10px;
top:10px;
bottom:10px;
width:220px;
background:rgba(0,0,0,.85);
border:1px solid var(--border);
padding:15px;
z-index:5;
}

.logo{
font-size:20px;
margin-bottom:20px;
font-weight:bold;
}

.menu button{
width:100%;
margin-bottom:8px;
padding:10px;
background:black;
border:1px solid var(--border);
color:var(--text);
cursor:pointer;
}

.menu button:hover{
box-shadow:0 0 15px var(--glow);
}

/* Top Bar */

.topbar{
position:fixed;
left:250px;
right:20px;
top:10px;
height:60px;
background:rgba(0,0,0,.8);
border:1px solid var(--border);
display:flex;
align-items:center;
padding:0 20px;
z-index:5;
}


/* Windows */

.window{
position:absolute;
background:rgba(0,0,0,.95);
border:1px solid var(--border);
box-shadow:0 0 15px rgba(94,255,247,.2);
width:500px;
height:350px;
z-index:10;
}

.titlebar{
height:35px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10px;
border-bottom:1px solid var(--border);
cursor:move;
}

.close{
cursor:pointer;
}

.content{
padding:15px;
height:calc(100% - 35px);
overflow:auto;
}

.note{
margin-bottom:15px;
padding:10px;
border:1px solid rgba(94,255,247,.2);
}

.note h3{
margin-bottom:10px;
}

pre{
white-space:pre-wrap;
color:#ffd38a;
}

/* Particles */

.particle{
position:fixed;
width:2px;
height:2px;
background:var(--border);
opacity:.4;
animation:float linear infinite;
}

@keyframes float{
from{
transform:translateY(100vh);
}
to{
transform:translateY(-100px);
}
}

#matrix{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
opacity:.10;
pointer-events:none;
}

#network{

position:fixed;

top:0;
left:240px;
right:0;
bottom:0;

pointer-events:none;

z-index:0;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<canvas id="network"></canvas>



<div class="grid"></div>


<div class="sidebar">
<div class="logo">KNOWLEDGE VAULT</div>

<div class="menu">
<button onclick="window.location.href='cli.html'">
CLI TOOLS
</button>
<button onclick="openWindow('Networking', netData)">NETWORKING</button>
<button onclick="openWindow('Linux', linuxData)">LINUX</button>
<button onclick="openWindow('Web Dev', webData)">WEB DEV</button>
</div>
</div>


<div class="topbar">
<h2>WHITEX DATABASE</h2>
</div>

<script>

/* Particles */

for(let i=0;i<100;i++){
let p=document.createElement("div");
p.className="particle";
p.style.left=Math.random()*100+"vw";
p.style.animationDuration=(5+Math.random()*15)+"s";
document.body.appendChild(p);
}

/* Notes */

const cliData = [
{
title:"Miller",
content:"mlr --csv cat file.csv"
},
{
title:"jq",
content:"jq '.name' file.json"
},
{
title:"grep",
content:"grep -R 'password' ."
}
];

const netData = [
{
title:"Nmap",
content:"nmap -sV 192.168.1.1"
},
{
title:"Ping",
content:"ping google.com"
}
];

const linuxData = [
{
title:"Find",
content:"find / -name test.txt"
},
{
title:"lsblk",
content:"lsblk -f"
}
];

const webData = [
{
title:"Flexbox",
content:"display:flex;"
},
{
title:"Grid",
content:"display:grid;"
}
];

/* Window System */

let z = 100;

function openWindow(title,data){

let win=document.createElement("div");
win.className="window";
win.style.left=260+Math.random()*200+"px";
win.style.top=100+Math.random()*100+"px";

win.innerHTML=`
<div class="titlebar">
<span>${title}</span>
<span class="close">✕</span>
</div>

<div class="content">
${data.map(item=>`
<div class="note">
<h3>${item.title}</h3>
<pre>${item.content}</pre>
</div>
`).join("")}
</div>
`;

document.body.appendChild(win);

win.querySelector(".close").onclick=()=>{
win.remove();
};

drag(win);

}

/* Drag */

function drag(el){

const title=el.querySelector(".titlebar");

let x=0,y=0,px=0,py=0;

title.onmousedown=(e)=>{

el.style.zIndex=++z;

px=e.clientX;
py=e.clientY;

document.onmousemove=(e)=>{

x=px-e.clientX;
y=py-e.clientY;

px=e.clientX;
py=e.clientY;

el.style.top=(el.offsetTop-y)+"px";
el.style.left=(el.offsetLeft-x)+"px";
};

document.onmouseup=()=>{
document.onmousemove=null;
};
};

}

const net=document.getElementById("network");
const nctx=net.getContext("2d");

net.width=window.innerWidth;
net.height=window.innerHeight;

const nodes=[];

for(let i=0;i<70;i++){

nodes.push({

x:Math.random()*net.width,
y:Math.random()*net.height,

vx:(Math.random()-.5)*0.5,
vy:(Math.random()-.5)*0.5

});

}

function animateNetwork(){

nctx.clearRect(
0,
0,
net.width,
net.height
);

for(let a of nodes){

a.x+=a.vx;
a.y+=a.vy;

if(a.x<0||a.x>net.width)
a.vx*=-1;

if(a.y<0||a.y>net.height)
a.vy*=-1;

nctx.fillStyle=getComputedStyle(document.documentElement)
.getPropertyValue('--accent');

nctx.fillRect(
a.x,
a.y,
2,
2
);

for(let b of nodes){

let dx=a.x-b.x;
let dy=a.y-b.y;

let dist=Math.sqrt(
dx*dx+dy*dy
);

if(dist<140){

nctx.strokeStyle=
"rgba(255,255,255,.08)";

nctx.beginPath();

nctx.moveTo(a.x,a.y);

nctx.lineTo(b.x,b.y);

nctx.stroke();

}

}

}

requestAnimationFrame(
animateNetwork
);

}

animateNetwork();

</script>

</body>
</html>
