};

let nsin = val => Math.sin(val) * 0.5 + 0.5;

let mountainDistortion = {
  uniforms: mountainUniforms,
  getDistortion: `
    uniform vec3 uAmp;
    uniform vec3 uFreq;
    #define PI 3.14159265358979
    float nsin(float val){ return sin(val) * 0.5+0.5; }
    vec3 getDistortion(float progress){
        float movementProgressFix = 0.02;
        return vec3( 
            cos(progress * PI * uFreq.x + uTime) * uAmp.x - cos(movementProgressFix * PI * uFreq.x + uTime) * uAmp.x,
            nsin(progress * PI * uFreq.y + uTime) * uAmp.y - nsin(movementProgressFix * PI * uFreq.y + uTime) * uAmp.y,
            nsin(progress * PI * uFreq.z + uTime) * uAmp.z - nsin(movementProgressFix * PI * uFreq.z + uTime) * uAmp.z
        );
    }
`,
  getJS: (progress, time) => {
    let movementProgressFix = 0.02;
    let uFreq = mountainUniforms.uFreq.value;
    let uAmp = mountainUniforms.uAmp.value;
    let distortion = new THREE.Vector3(
      Math.cos(progress * Math.PI * uFreq.x + time) * uAmp.x - Math.cos(movementProgressFix * Math.PI * uFreq.x + time) * uAmp.x,
      nsin(progress * Math.PI * uFreq.y + time) * uAmp.y - nsin(movementProgressFix * Math.PI * uFreq.y + time) * uAmp.y,
      nsin(progress * Math.PI * uFreq.z + time) * uAmp.z - nsin(movementProgressFix * Math.PI * uFreq.z + time) * uAmp.z
    );
    let lookAtAmp = new THREE.Vector3(2, 2, 2);
    let lookAtOffset = new THREE.Vector3(0, 0, -5);
    return distortion.multiply(lookAtAmp).add(lookAtOffset);
  }
};

let xyDistortion = {

    uniform vec2 uFreq;

			sin(progress * PI * uFreq.y + PI/2. + uTime) * uAmp.y - sin(movementProgressFix * PI * uFreq.y + PI/2. + uTime) * uAmp.y,

`,

const turbulentDistortion = {
  uniforms: turbulentUniforms,
  getDistortion: `
        uniform vec4 uFreq;
        uniform vec4 uAmp;
        float nsin(float val){ return sin(val) * 0.5+0.5; }
		#define PI 3.14159265358979
        float getDistortionX(float progress){
            return (cos( PI * progress * uFreq.r + uTime) * uAmp.r + pow(cos(PI * progress * uFreq.g + uTime * (uFreq.g / uFreq.r)),2. )* uAmp.g);
        }
        float getDistortionY(float progress){
            return (-nsin( PI * progress * uFreq.b + uTime) * uAmp.b + -pow(nsin(PI * progress * uFreq.a + uTime / (uFreq.b / uFreq.a) ),5.) * uAmp.a);
        }
        vec3 getDistortion(float progress){
            return vec3(getDistortionX(progress)-getDistortionX(0.0125) , getDistortionY(progress)- getDistortionY(0.0125), 0.);
        }
    `,
  getJS: (progress, time) => {
    const uFreq = turbulentUniforms.uFreq.value;
    const uAmp = turbulentUniforms.uAmp.value;
    const getX = p => Math.cos(Math.PI * p * uFreq.x + time) * uAmp.x + Math.pow(Math.cos(Math.PI * p * uFreq.y + time * (uFreq.y / uFreq.x)), 2) * uAmp.y;
    const getY = p => -nsin(Math.PI * p * uFreq.z + time) * uAmp.z - Math.pow(nsin(Math.PI * p * uFreq.w + time / (uFreq.z / uFreq.w)), 5) * uAmp.w;
    let distortion = new THREE.Vector3(getX(progress) - getX(progress + 0.007), getY(progress) - getY(progress + 0.007), 0);
    let lookAtAmp = new THREE.Vector3(-2, -5, 0);

            return (-nsin( PI * progress * uFreq.b ) * uAmp.b + -pow(nsin(PI * progress * uFreq.a  / (uFreq.b / uFreq.a) ),5.) * uAmp.a);

const deepDistortion = {

        uniform vec4 uFreq;
        uniform vec4 uAmp;
        uniform vec2 uPowY;
        float nsin(float val){ return sin(val) * 0.5+0.5; }
		#define PI 3.14159265358979
        float getDistortionX(float progress){ return (sin(progress * PI * uFreq.x + uTime) * uAmp.x); }
        float getDistortionY(float progress){ return (pow(abs(progress * uPowY.x),uPowY.y) + sin(progress * PI * uFreq.y + uTime) * uAmp.y); }

            return vec3(getDistortionX(progress)-getDistortionX(0.02) , getDistortionY(progress)- getDistortionY(0.02), 0.);

console.log(POSTPROCESSING);
class App {
  constructor(container, options = {}) {
    this.options = options;
    if (this.options.distortion == null) {
      this.options.distortion = {
        uniforms: distortion_uniforms,
        getDistortion: distortion_vertex
      };
    }
    this.container = container;
    this.renderer = new THREE.WebGLRenderer({ antialias: false });

    this.renderer.setPixelRatio(window.devicePixelRatio);

    };
    this.clock = new THREE.Clock();
    this.assets = {};
    this.disposed = false;

    this.road = new Road(this, options);
    this.leftCarLights = new CarLights(this, options, options.colors.leftCars, options.movingAwaySpeed, new THREE.Vector2(0, 1 - options.carLightsFade));

    this.bloomPass = new POSTPROCESSING.EffectPass(this.camera, new POSTPROCESSING.BloomEffect({ luminanceThreshold: 0.2, luminanceSmoothing: 0, resolutionScale: 1 }));
    console.log(this.assets.smaa, this.camera);
    const smaaPass = new POSTPROCESSING.EffectPass(this.camera, new POSTPROCESSING.SMAAEffect(this.assets.smaa.search, this.assets.smaa.area, POSTPROCESSING.SMAAPreset.MEDIUM));

    this.bloomPass.renderToScreen = false;

    this.composer.addPass(this.renderPass);
    this.composer.addPass(this.bloomPass);
    this.composer.addPass(smaaPass);

    const assets = this.assets;
    return new Promise((resolve, reject) => {
      const manager = new THREE.LoadingManager(resolve);
      const searchImage = new Image();

      assets.smaa = {};
      searchImage.addEventListener("load", function() { assets.smaa.search = this; manager.itemEnd("smaa-search"); });

      manager.itemStart("smaa-area");

    this.speedUpTarget = 0;
  }

    let lerpPercentage = Math.exp(-(-60 * Math.log2(1 - 0.1)) * delta);
    this.speedUp += lerp(this.speedUp, this.speedUpTarget, lerpPercentage, 0.00001);
    this.timeOffset += this.speedUp * delta;
    let time = this.clock.elapsedTime + this.timeOffset;

    this.rightCarLights.update(time);
    this.leftCarLights.update(time);
    this.leftSticks.update(time);
    this.road.update(time);

    let updateCamera = false;
    let fovChange = lerp(this.camera.fov, this.fovTarget, lerpPercentage);
    if (fovChange !== 0) {
      this.camera.fov += fovChange * delta * 6;
      updateCamera = true;
    }
    if (this.options.distortion.getJS) {
      const distortion = this.options.distortion.getJS(0.025, time);
      this.camera.lookAt(new THREE.Vector3(this.camera.position.x + distortion.x, this.camera.position.y + distortion.y, this.camera.position.z + distortion.z));
      updateCamera = true;
    }
    if (updateCamera) { this.camera.updateProjectionMatrix(); }
  }
  render(delta) { this.composer.render(delta); }
  dispose() { this.disposed = true; }
  setSize(width, height, updateStyles) { this.composer.setSize(width, height, updateStyles); }
  tick() {
    if (this.disposed || !this) return;
    if (resizeRendererToDisplaySize(this.renderer, this.setSize)) {
      const canvas = this.renderer.domElement;
      this.camera.aspect = canvas.clientWidth / canvas.clientHeight;
      this.camera.updateProjectionMatrix();
    }
    const delta = this.clock.getDelta();
    this.render(delta);
    this.update(delta);
    requestAnimationFrame(this.tick);
  }
}

const distortion_uniforms = {
  uDistortionX: new THREE.Uniform(new THREE.Vector2(80, 3)),
  uDistortionY: new THREE.Uniform(new THREE.Vector2(-40, 2.5))
};

const distortion_vertex = `
#define PI 3.14159265358979
  uniform vec2 uDistortionX;
  uniform vec2 uDistortionY;
  float nsin(float val){ return sin(val) * 0.5+0.5; }
  vec3 getDistortion(float progress){
        progress = clamp(progress, 0.,1.);
        float xAmp = uDistortionX.r;
        float xFreq = uDistortionX.g;
        float yAmp = uDistortionY.r;
        float yFreq = uDistortionY.g;
        return vec3( xAmp * nsin(progress* PI * xFreq - PI / 2. ) , yAmp * nsin(progress * PI *yFreq - PI / 2. ) , 0. );
    }
`;

const random = base => {
  if (Array.isArray(base)) return Math.random() * (base[1] - base[0]) + base[0];
  return Math.random() * base;
};
const pickRandom = arr => {
  if (Array.isArray(arr)) return arr[Math.floor(Math.random() * arr.length)];
  return arr;
};
function lerp(current, target, speed = 0.1, limit = 0.001) {
  let change = (target - current) * speed;
  if (Math.abs(change) < limit) { change = target - current; }
  return change;
}

class CarLights {
  constructor(webgl, options, colors, speed, fade) {
    this.webgl = webgl;
    this.options = options;
    this.colors = colors;
    this.speed = speed;
    this.fade = fade;
  }
  init() {
    const options = this.options;
    let curve = new THREE.LineCurve3(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -1));
    let geometry = new THREE.TubeBufferGeometry(curve, 40, 1, 8, false);
    let instanced = new THREE.InstancedBufferGeometry().copy(geometry);
    instanced.maxInstancedCount = options.lightPairsPerRoadWay * 2;
    let laneWidth = options.roadWidth / options.lanesPerRoad;

    let aOffset = [];
    let aMetrics = [];
    let aColor = [];
    let colors = this.colors;
    if (Array.isArray(colors)) { colors = colors.map(c => new THREE.Color(c)); } else { colors = new THREE.Color(colors); }

    for (let i = 0; i < options.lightPairsPerRoadWay; i++) {
      let radius = random(options.carLightsRadius);
      let length = random(options.carLightsLength);
      let speed = random(this.speed);
      let carLane = i % 3;
      let laneX = carLane * laneWidth - options.roadWidth / 2 + laneWidth / 2;
      let carWidth = random(options.carWidthPercentage) * laneWidth;
      let carShiftX = random(options.carShiftX) * laneWidth;
      laneX += carShiftX;
      let offsetY = random(options.carFloorSeparation) + radius * 1.3;
      let offsetZ = -random(options.length);

      aOffset.push(laneX - carWidth / 2, offsetY, offsetZ);
      aOffset.push(laneX + carWidth / 2, offsetY, offsetZ);
      aMetrics.push(radius, length, speed);
      aMetrics.push(radius, length, speed);
      let color = pickRandom(colors);
      aColor.push(color.r, color.g, color.b);
      aColor.push(color.r, color.g, color.b);
    }
    instanced.addAttribute("aOffset", new THREE.InstancedBufferAttribute(new Float32Array(aOffset), 3, false));
    instanced.addAttribute("aMetrics", new THREE.InstancedBufferAttribute(new Float32Array(aMetrics), 3, false));
    instanced.addAttribute("aColor", new THREE.InstancedBufferAttribute(new Float32Array(aColor), 3, false));
    
    let material = new THREE.ShaderMaterial({
      fragmentShader: carLightsFragment,
      vertexShader: carLightsVertex,
      transparent: true,
      uniforms: Object.assign({
          uTime: new THREE.Uniform(0),
          uTravelLength: new THREE.Uniform(options.length),
          uFade: new THREE.Uniform(this.fade)
        }, this.webgl.fogUniforms, options.distortion.uniforms)
    });
    material.onBeforeCompile = shader => {
      shader.vertexShader = shader.vertexShader.replace("#include <getDistortion_vertex>", options.distortion.getDistortion);
      console.log(shader.vertex);
    };
    let mesh = new THREE.Mesh(instanced, material);
    mesh.frustumCulled = false;
    this.webgl.scene.add(mesh);
    this.mesh = mesh;
  }
  update(time) { this.mesh.material.uniforms.uTime.value = time; }
}

const carLightsFragment = `
  #define USE_FOG;
  ${THREE.ShaderChunk["fog_pars_fragment"]}
  varying vec3 vColor;
  varying vec2 vUv; 
  uniform vec2 uFade;
  void main() {
  vec3 color = vec3(vColor);
  float fadeStart = 0.4;
  float maxFade = 0.;
  float alpha = 1.;
  alpha = smoothstep(uFade.x, uFade.y, vUv.x);
  gl_FragColor = vec4(color,alpha);
  if (gl_FragColor.a < 0.0001) discard;
  ${THREE.ShaderChunk["fog_fragment"]}
  }
`;

const carLightsVertex = `
  #define USE_FOG;
  ${THREE.ShaderChunk["fog_pars_vertex"]}
  attribute vec3 aOffset;
  attribute vec3 aMetrics;
  attribute vec3 aColor;
  uniform float uTravelLength;
  uniform float uTime;
  uniform float uSpeed;
  varying vec2 vUv; 
  varying vec3 vColor; 
  #include <getDistortion_vertex>
  void main() {
    vec3 transformed = position.xyz;
    float radius = aMetrics.r;
    float myLength = aMetrics.g;
    float speed = aMetrics.b;
    transformed.xy *= radius ;
    transformed.z *= myLength;
    transformed.z += myLength-mod( uTime *speed + aOffset.z, uTravelLength);
    transformed.xy += aOffset.xy;
    float progress = abs(transformed.z / uTravelLength);
    transformed.xyz += getDistortion(progress);
    vec4 mvPosition = modelViewMatrix * vec4(transformed,1.);
    gl_Position = projectionMatrix * mvPosition;
    vUv = uv;
    vColor = aColor;
    ${THREE.ShaderChunk["fog_vertex"]}
  }`;

class LightsSticks {
  constructor(webgl, options) {
    this.webgl = webgl;
    this.options = options;
  }
  init() {
    const options = this.options;
    const geometry = new THREE.PlaneBufferGeometry(1, 1);
    let instanced = new THREE.InstancedBufferGeometry().copy(geometry);
    let totalSticks = options.totalSideLightSticks;
    instanced.maxInstancedCount = totalSticks;
    let stickoffset = options.length / (totalSticks - 1);
    const aOffset = [];
    const aColor = [];
    const aMetrics = [];
    let colors = options.colors.sticks;
    if (Array.isArray(colors)) { colors = colors.map(c => new THREE.Color(c)); } else { colors = new THREE.Color(colors); }

    for (let i = 0; i < totalSticks; i++) {
      let width = random(options.lightStickWidth);
      let height = random(options.lightStickHeight);
      aOffset.push((i - 1) * stickoffset * 2 + stickoffset * Math.random());
      let color = pickRandom(colors);
      aColor.push(color.r, color.g, color.b);
      aMetrics.push(width, height);
    }
    instanced.addAttribute("aOffset", new THREE.InstancedBufferAttribute(new Float32Array(aOffset), 1, false));
    instanced.addAttribute("aColor", new THREE.InstancedBufferAttribute(new Float32Array(aColor), 3, false));
    instanced.addAttribute("aMetrics", new THREE.InstancedBufferAttribute(new Float32Array(aMetrics), 2, false));
    
    const material = new THREE.ShaderMaterial({
      fragmentShader: sideSticksFragment,
      vertexShader: sideSticksVertex,
      side: THREE.DoubleSide,
      uniforms: Object.assign({
          uTravelLength: new THREE.Uniform(options.length),
          uTime: new THREE.Uniform(0)
        }, this.webgl.fogUniforms, options.distortion.uniforms)
    });
    material.onBeforeCompile = shader => {
      shader.vertexShader = shader.vertexShader.replace("#include <getDistortion_vertex>", options.distortion.getDistortion);
    };
    const mesh = new THREE.Mesh(instanced, material);
    mesh.frustumCulled = false;
    this.webgl.scene.add(mesh);
    this.mesh = mesh;
  }
  update(time) { this.mesh.material.uniforms.uTime.value = time; }
}

const sideSticksVertex = `
#define USE_FOG;
${THREE.ShaderChunk["fog_pars_vertex"]}
attribute float aOffset;
attribute vec3 aColor;
attribute vec2 aMetrics;
uniform float uTravelLength;
uniform float uTime;
varying vec3 vColor;
mat4 rotationY( in float angle ) {
	return mat4( cos(angle), 0, sin(angle), 0, 0, 1.0, 0, 0, -sin(angle), 0, cos(angle), 0, 0, 0, 0, 1);
}
#include <getDistortion_vertex>
void main(){
  vec3 transformed = position.xyz;
  float width = aMetrics.x;
  float height = aMetrics.y;
  transformed.xy *= vec2(width,height);
  float time = mod(uTime * 60. *2. + aOffset , uTravelLength);
  transformed = (rotationY(3.14/2.) * vec4(transformed,1.)).xyz;
  transformed.z += - uTravelLength + time;
  float progress = abs(transformed.z / uTravelLength);
  transformed.xyz += getDistortion(progress);
  transformed.y += height /2.;
  transformed.x += -width/2.;
  vec4 mvPosition = modelViewMatrix * vec4(transformed,1.);
  gl_Position = projectionMatrix * mvPosition;
  vColor = aColor;
  ${THREE.ShaderChunk["fog_vertex"]}
}
`;
const sideSticksFragment = `
#define USE_FOG;
${THREE.ShaderChunk["fog_pars_fragment"]}
varying vec3 vColor;
void main(){
  vec3 color = vec3(vColor);
  gl_FragColor = vec4(color,1.);
  ${THREE.ShaderChunk["fog_fragment"]}
}
`;

class Road {
  constructor(webgl, options) {
    this.webgl = webgl;
    this.options = options;
    this.uTime = new THREE.Uniform(0);
  }
  createIsland() { const options = this.options; let segments = 100; }
  createPlane(side, width, isRoad) {
    const options = this.options;
    let segments = 100;
    const geometry = new THREE.PlaneBufferGeometry(isRoad ? options.roadWidth : options.islandWidth, options.length, 20, segments);
    let uniforms = {
      uTravelLength: new THREE.Uniform(options.length),
      uColor: new THREE.Uniform(new THREE.Color(isRoad ? options.colors.roadColor : options.colors.islandColor)),
      uTime: this.uTime
    };
    if (isRoad) {
      uniforms = Object.assign(uniforms, {
        uLanes: new THREE.Uniform(options.lanesPerRoad),
        uBrokenLinesColor: new THREE.Uniform(new THREE.Color(options.colors.brokenLines)),
        uShoulderLinesColor: new THREE.Uniform(new THREE.Color(options.colors.shoulderLines)),
        uShoulderLinesWidthPercentage: new THREE.Uniform(options.shoulderLinesWidthPercentage),
        uBrokenLinesLengthPercentage: new THREE.Uniform(options.brokenLinesLengthPercentage),
        uBrokenLinesWidthPercentage: new THREE.Uniform(options.brokenLinesWidthPercentage)
      });
    }
    const material = new THREE.ShaderMaterial({
      fragmentShader: isRoad ? roadFragment : islandFragment,
      vertexShader: roadVertex,
      side: THREE.DoubleSide,
      uniforms: Object.assign(uniforms, this.webgl.fogUniforms, options.distortion.uniforms)
    });
    material.onBeforeCompile = shader => {
      shader.vertexShader = shader.vertexShader.replace("#include <getDistortion_vertex>", options.distortion.getDistortion);
    };
    const mesh = new THREE.Mesh(geometry, material);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.z = -options.length / 2;
    mesh.position.x += (this.options.islandWidth / 2 + options.roadWidth / 2) * side;
    this.webgl.scene.add(mesh);
    return mesh;
  }
  init() {
    this.leftRoadWay = this.createPlane(-1, this.options.roadWidth, true);
    this.rightRoadWay = this.createPlane(1, this.options.roadWidth, true);
    this.island = this.createPlane(0, this.options.islandWidth, false);
  }
  update(time) { this.uTime.value = time; }
}

const roadBaseFragment = `
    #define USE_FOG;
    varying vec2 vUv; 
    uniform vec3 uColor;
    uniform float uTime;
    #include <roadMarkings_vars>
    ${THREE.ShaderChunk["fog_pars_fragment"]}
    void main() {
        vec2 uv = vUv;
        vec3 color = vec3(uColor);
        #include <roadMarkings_fragment>
        gl_FragColor = vec4(color,1.);
        ${THREE.ShaderChunk["fog_fragment"]}
    }
`;
const islandFragment = roadBaseFragment.replace("#include <roadMarkings_fragment>", "").replace("#include <roadMarkings_vars>", "");
const roadMarkings_vars = `
    uniform float uLanes;
    uniform vec3 uBrokenLinesColor;
    uniform vec3 uShoulderLinesColor;
    uniform float uShoulderLinesWidthPercentage;
    uniform float uBrokenLinesWidthPercentage;
    uniform float uBrokenLinesLengthPercentage;
    highp float random(vec2 co)
    {
        highp float a = 12.9898;
        highp float b = 78.233;
        highp float c = 43758.5453;
        highp float dt= dot(co.xy ,vec2(a,b));
        highp float sn= mod(dt,3.14);
        return fract(sin(sn) * c);
    }
`;
const roadMarkings_fragment = `
        uv.y = mod(uv.y + uTime * 0.1,1.);
        float brokenLineWidth = 1. / uLanes * uBrokenLinesWidthPercentage;
        float laneEmptySpace = 1. - uBrokenLinesLengthPercentage;
        float brokenLines = step(1.-brokenLineWidth * uLanes,fract(uv.x * uLanes)) * step(laneEmptySpace, fract(uv.y * 100.)) ;
        brokenLines *= step(uv.x * uLanes,uLanes-1.);
        color = mix(color, uBrokenLinesColor, brokenLines);
        float shoulderLinesWidth = 1. / uLanes * uShoulderLinesWidthPercentage;
        float shoulderLines = step(1.-shoulderLinesWidth, uv.x) + step(uv.x, shoulderLinesWidth);
        color = mix(color, uBrokenLinesColor, shoulderLines);
        vec2 noiseFreq = vec2(4., 7000.);
        float roadNoise = random( floor(uv * noiseFreq)/noiseFreq ) * 0.02 - 0.01; 
        color += roadNoise;
`;
const roadFragment = roadBaseFragment.replace("#include <roadMarkings_fragment>", roadMarkings_fragment).replace("#include <roadMarkings_vars>", roadMarkings_vars);

const roadVertex = `
#define USE_FOG;
uniform float uTime;
${THREE.ShaderChunk["fog_pars_vertex"]}
uniform float uTravelLength;
varying vec2 vUv; 
#include <getDistortion_vertex>
void main() {
  vec3 transformed = position.xyz;
  vec3 distortion = getDistortion((transformed.y + uTravelLength / 2.) / uTravelLength);
  transformed.x += distortion.x;
  transformed.z += distortion.y;
  transformed.y += -1.*distortion.z; 
  vec4 mvPosition = modelViewMatrix * vec4(transformed,1.);
  gl_Position = projectionMatrix * mvPosition;
  vUv = uv;
  ${THREE.ShaderChunk["fog_vertex"]}
}`;

function resizeRendererToDisplaySize(renderer, setSize) {
  const canvas = renderer.domElement;
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  const needResize = canvas.width !== width || canvas.height !== height;
  if (needResize) { setSize(width, height, false); }
  return needResize;
}

const container = document.getElementById("app");
let myApp = null;

function buildOptions(themeKey){
    const theme = themes[themeKey];
    return {
        onSpeedUp:(ev)=>{},
        onSlowDown:(ev)=>{},
        distortion: theme.distortion,
        length:400,
        roadWidth:9,
        islandWidth:2,
        lanesPerRoad:3,
        fov:90,
        fovSpeedUp:150,
        speedUp:2,
        carLightsFade:0.4,
        totalSideLightSticks:50,
        lightPairsPerRoadWay:50,
        shoulderLinesWidthPercentage:0.05,
        brokenLinesWidthPercentage:0.1,
        brokenLinesLengthPercentage:0.5,
        lightStickWidth:[0.12,0.5],
        lightStickHeight:[1.3,1.7],
        movingAwaySpeed:[60,80],
        movingCloserSpeed:[-120,-160],
        carLightsLength:[400*0.05,400*0.15],
        carLightsRadius:[0.05,0.14],
        carWidthPercentage:[0.3,0.5],
        carShiftX:[-0.2,0.2],
        carFloorSeparation:[0.05,1],
        colors: theme.colors
    };
}

function launchTheme(themeKey){
    // Stop and tear down the previous animation, if any
    if (myApp) {
        myApp.dispose();
        container.removeEventListener("mousedown", myApp.onMouseDown);
        container.removeEventListener("mouseup", myApp.onMouseUp);
        container.removeEventListener("mouseout", myApp.onMouseUp);
        if (myApp.renderer) {
            myApp.renderer.dispose();
            if (myApp.renderer.domElement && myApp.renderer.domElement.parentNode) {
                myApp.renderer.domElement.parentNode.removeChild(myApp.renderer.domElement);
            }
        }
        myApp = null;
    }
    const options = buildOptions(themeKey);
    myApp = new App(container, options);
    myApp.loadAssets().then(()=>{ myApp.init(); });
}

// Clicking anywhere on the background animation cycles to the next theme
const themeOrder = ['mountain', 'deep', 'xy', 'longrace', 'turbulent'];
let themeIndex = 0;
container.style.cursor = 'pointer';
container.addEventListener('click', () => {
    themeIndex = (themeIndex + 1) % themeOrder.length;
    launchTheme(themeOrder[themeIndex]);
});

// Start with the default (mountain) animation on load
launchTheme(themeOrder[themeIndex]);
