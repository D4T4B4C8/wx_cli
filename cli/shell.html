<script>
(function(){
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;

  const vert = `
    attribute vec2 aPos;
    void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
  `;

  const frag = `
    #ifdef GL_ES
    precision mediump float;
    #endif

    uniform vec2  uRes;
    uniform vec2  uMouse;
    uniform float uTime;

    float rand(vec2 co) {
      return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453);
    }

    vec2 rotate2D(vec2 p, float a) {
      float c = cos(a), s = sin(a);
      return vec2(c*p.x - s*p.y, s*p.x + c*p.y);
    }

    vec3 gradColor(float t) {
      vec3 c0 = vec3(1.0,  0.624, 0.988);
      vec3 c1 = vec3(0.322, 0.153, 1.0);
      return mix(c0, c1, clamp(t, 0.0, 1.0));
    }

    void main() {
      vec2 fc = gl_FragCoord.xy;
      vec2 uv0 = fc / uRes;

      float aspect = uRes.x / uRes.y;
      vec2 p = uv0 * 2.0 - 1.0;
      p.x *= aspect;

      float angle = 20.0 * 3.14159265 / 180.0;
      vec2 pr = rotate2D(p, angle);
      pr.x /= aspect;
      vec2 uv = pr * 0.5 + 0.5;

      float t = uv.x;
      vec3 base = gradColor(t);

      vec2 mouseUV = vec2(uMouse.x / uRes.x, uMouse.y / uRes.y);
      float d = length(uv0 - mouseUV);
      float r = 0.5;
      float dn = d / r;
      float spotSoftness = 1.0;
      float spot = (1.0 - 2.0 * pow(dn, spotSoftness)) * 1.0;
      vec3 cir = vec3(spot);

      float blindCount = 16.0;
      float stripe = fract(uv.x * blindCount);
      vec3 ran_v = vec3(stripe);

      vec3 col = cir + base - ran_v;
      col += (rand(fc + uTime) - 0.5) * 0.5;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  const vs = compileShader(gl.VERTEX_SHADER, vert);
  const fs = compileShader(gl.FRAGMENT_SHADER, frag);
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
    return;
  }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
    -1, -1,  3, -1,  -1,  3
  ]), gl.STATIC_DRAW);

  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const uRes   = gl.getUniformLocation(prog, 'uRes');
  const uMouse = gl.getUniformLocation(prog, 'uMouse');
  const uTime  = gl.getUniformLocation(prog, 'uTime');

  let W = 0, H = 0;
  let mouseX = 0, mouseY = 0;
  let smoothX = 0, smoothY = 0;
  let lastT = 0;
  const DAMP = 0.15;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = Math.floor(window.innerWidth  * dpr);
    H = Math.floor(window.innerHeight * dpr);
    canvas.width  = W;
    canvas.height = H;
    gl.viewport(0, 0, W, H);
    smoothX = mouseX = W / 2;
    smoothY = mouseY = H / 2;
  }

  window.addEventListener('resize', resize);
  resize();

  window.addEventListener('mousemove', e => {
    const dpr = window.devicePixelRatio || 1;
    mouseX = e.clientX * dpr;
    mouseY = (window.innerHeight - e.clientY) * dpr;
  });

  window.addEventListener('touchmove', e => {
    e.preventDefault();
    const dpr = window.devicePixelRatio || 1;
    const t = e.touches[0];
    mouseX = t.clientX * dpr;
    mouseY = (window.innerHeight - t.clientY) * dpr;
  }, { passive: false });

  function loop(ts) {
    requestAnimationFrame(loop);
    const dt = lastT ? (ts - lastT) / 1000 : 0;
    lastT = ts;

    const factor = Math.min(1, 1 - Math.exp(-dt / Math.max(1e-4, DAMP)));
    smoothX += (mouseX - smoothX) * factor;
    smoothY += (mouseY - smoothY) * factor;

    gl.uniform2f(uRes, W, H);
    gl.uniform2f(uMouse, smoothX, smoothY);
    gl.uniform1f(uTime, ts * 0.001);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  requestAnimationFrame(loop);
})();

/* Window System */

let z = 100;

function openWindow(title,data){

let win=document.createElement("div");
win.className="window";
win.style.left=260+Math.random()*200+"px";
win.style.top=100+Math.random()*100+"px";

win.innerHTML=`
<div class="titlebar">
<span>${title}</span>
<span class="close">✕</span>
</div>

<div class="content">
${data.map(item=>`
<div class="note">
<h3>${item.title}</h3>
<pre>${item.content}</pre>
</div>
`).join("")}
</div>
`;

document.body.appendChild(win);

win.querySelector(".close").onclick=()=>{
win.remove();
};

drag(win);

}

/* Drag */

function drag(el){

const title=el.querySelector(".titlebar");

let x=0,y=0,px=0,py=0;

title.onmousedown=(e)=>{

el.style.zIndex=++z;

px=e.clientX;
py=e.clientY;

document.onmousemove=(e)=>{

x=px-e.clientX;
y=py-e.clientY;

px=e.clientX;
py=e.clientY;

el.style.top=(el.offsetTop-y)+"px";
el.style.left=(el.offsetLeft-x)+"px";
};

document.onmouseup=()=>{
document.onmousemove=null;
};
};

}
