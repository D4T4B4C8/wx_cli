<script>
/* Data Vault */
const cliData = [
  { title:"Miller", content:"mlr --csv cat file.csv" }, /* cite: 1 */
  { title:"jq", content:"jq '.name' file.json" }, /* cite: 1 */
  { title:"grep", content:"grep -R 'password' ." } /* cite: 1 */
];

const netData = [
  { title:"Nmap", content:"nmap -sV 192.168.1.1" }, /* cite: 1 */
  { title:"Ping", content:"ping google.com" } /* cite: 1 */
];

const linuxData = [
  { title:"Find", content:"find / -name test.txt" }, /* cite: 1 */
  { title:"lsblk", content:"lsblk -f" } /* cite: 1 */
];

const webData = [
  { title:"Flexbox", content:"display:flex;" }, /* cite: 1 */
  { title:"Grid", content:"display:grid;" } /* cite: 1 */
];

/* Window System */
let z = 100; /* cite: 1 */

function openWindow(title, data){
  let win = document.createElement("div"); /* cite: 1 */
  win.className = "window"; /* cite: 1 */
  win.style.left = 260 + Math.random() * 200 + "px"; /* cite: 1 */
  win.style.top = 100 + Math.random() * 100 + "px"; /* cite: 1 */

  win.innerHTML = `
    <div class="titlebar">
      <span>${title}</span>
      <span class="close">✕</span>
    </div>
    <div class="content">
      ${data.map(item => `
        <div class="note">
          <h3>${item.title}</h3>
          <pre>${item.content}</pre>
        </div>
      `).join("")}
    </div>
  `; /* cite: 1 */

  document.body.appendChild(win); /* cite: 1 */

  // Focus window on selection
  win.style.zIndex = ++z; /* cite: 1 */
  win.addEventListener('mousedown', () => {
    win.style.zIndex = ++z; /* cite: 1 */
  }); /* cite: 1 */

  win.querySelector(".close").onclick = () => {
    win.remove(); /* cite: 1 */
  }; /* cite: 1 */

  drag(win); /* cite: 1 */
}

/* Drag Windows */
function drag(el){
  const title = el.querySelector(".titlebar"); /* cite: 1 */
  let x = 0, y = 0, px = 0, py = 0; /* cite: 1 */

  title.onmousedown = (e) => {
    el.style.zIndex = ++z; /* cite: 1 */
    px = e.clientX; /* cite: 1 */
    py = e.clientY; /* cite: 1 */

    document.onmousemove = (e) => {
      x = px - e.clientX; /* cite: 1 */
      y = py - e.clientY; /* cite: 1 */
      px = e.clientX; /* cite: 1 */
      py = e.clientY; /* cite: 1 */

      el.style.top = (el.offsetTop - y) + "px"; /* cite: 1 */
      el.style.left = (el.offsetLeft - x) + "px"; /* cite: 1 */
    }; /* cite: 1 */

    document.onmouseup = () => {
      document.onmousemove = null; /* cite: 1 */
    }; /* cite: 1 */
  }; /* cite: 1 */
}

/* Supernova Engine */
const canvas = document.getElementById('particle-canvas'); /* cite: 1 */
const ctx = canvas.getContext('2d'); /* cite: 1 */

let width, height, centerX, centerY; /* cite: 1 */
let particles = []; /* cite: 1 */
const particleCount = 2000; /* cite: 1 */
const animationDuration = 10000; /* cite: 1 */

function resizeCanvas() {
  width = canvas.width = window.innerWidth; /* cite: 1 */
  height = canvas.height = window.innerHeight; /* cite: 1 */
  centerX = width / 2; /* cite: 1 */
  centerY = height / 2; /* cite: 1 */
}
window.addEventListener('resize', resizeCanvas); /* cite: 1 */
resizeCanvas(); /* cite: 1 */

class Particle {
  constructor() {
    this.angle = Math.random() * Math.PI * 2; /* cite: 1 */
    this.radius = Math.random() * 1.5 + 0.5; /* cite: 1 */
    this.speed = Math.random() * 400 + 200; /* cite: 1 */
    this.maxDistance = Math.random() * Math.max(width, height) * 0.6; /* cite: 1 */
  }

  update(progress) {
    let easedProgress = 1 - Math.pow(Math.abs(progress - 0.5) * 2, 2); /* cite: 1 */
    let currentDistance = easedProgress * this.maxDistance; /* cite: 1 */

    this.x = centerX + Math.cos(this.angle) * currentDistance; /* cite: 1 */
    this.y = centerY + Math.sin(this.angle) * currentDistance; /* cite: 1 */

    let prevDistance = (1 - Math.pow(Math.abs((progress - 0.01) - 0.5) * 2, 2)) * this.maxDistance; /* cite: 1 */
    this.prevX = centerX + Math.cos(this.angle) * prevDistance; /* cite: 1 */
    this.prevY = centerY + Math.sin(this.angle) * prevDistance; /* cite: 1 */

    if (progress < 0.5) { 
      this.color = `hsl(0, 100%, ${60 + easedProgress * 40}%)`; /* cite: 2 - changed to bloody red */
    } else { 
      this.color = `hsl(0, 0%, ${60 + easedProgress * 40}%)`; /* cite: 2 - changed to white */
    }
  }

  draw() {
    ctx.beginPath(); /* cite: 1 */
    ctx.moveTo(this.prevX, this.prevY); /* cite: 1 */
    ctx.lineTo(this.x, this.y); /* cite: 1 */
    ctx.strokeStyle = this.color; /* cite: 1 */
    ctx.lineWidth = this.radius * 2; /* cite: 1 */
    ctx.stroke(); /* cite: 1 */
  }
}

function init() {
  particles = []; /* cite: 1 */
  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle()); /* cite: 1 */
  }
}

function animate(timestamp) {
  const elapsed = timestamp % animationDuration; /* cite: 1 */
  const progress = elapsed / animationDuration; /* cite: 1 */

  ctx.fillStyle = 'rgba(10, 10, 20, 0.1)'; /* cite: 1 */
  ctx.fillRect(0, 0, width, height); /* cite: 1 */
  
  ctx.lineCap = 'round'; /* cite: 1 */
  
  particles.forEach(p => {
    p.update(progress); /* cite: 1 */
    p.draw(); /* cite: 1 */
  });

  requestAnimationFrame(animate); /* cite: 1 */
}

init(); /* cite: 1 */
requestAnimationFrame(animate); /* cite: 1 */
</script>
