<script>
(function(w,d){try{
  var q="(max-width:820px), (hover:none) and (pointer:coarse) and (max-height:520px)", m=w.matchMedia(q);
  if(!m.matches) return;                       /* PC / laptop: do nothing */
  d.documentElement.className+=" kv-mobile";
  w.requestAnimationFrame=function(){return 0};
  /* if the window is resized across the breakpoint, reload to get the right mode */
  var was=m.matches, f=function(e){ if(e.matches!==was) w.location.reload(); };
  if(m.addEventListener) m.addEventListener("change",f); else if(m.addListener) m.addListener(f);
}catch(e){}})(window,document);
</script>

<script>

/* ============ Drawable branching background ============ */

const canvas = document.getElementById('bgCanvas');
const c = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;
let bg = 'black';
c.fillStyle = bg;
c.fillRect(0, 0, canvas.width, canvas.height);

window.addEventListener('resize', () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  c.fillStyle = bg;
  c.fillRect(0, 0, canvas.width, canvas.height);
});

let down = false;
let xys = [];
let idx = 0;
let branchers = {};

setInterval(() => {
  for (let i in branchers) {
    for (let j in branchers[i]) branchers[i][j]();
  }
}, 16);

function branch(lidx, x, y, ang, a = .4) {
  let rr = Math.random() * 1 + .1;
  let af = .002 + Math.random() * .01;
  if (Math.random() < .01) af = 1;
  let death = 20 + Math.random() * 20;
  if (Math.random() < .002) {
    death = 30 + Math.random() * 70;
    a = 1;
  }
  let life = 0;
  let asf = 0;
  const t = () => {
    a -= af;
    asf += (a - asf) / 8;
    let col = `rgba(255, 255, 255, ${asf})`;
    ang += Math.random() * .02 - .01;
    let vx = Math.cos(ang) * rr;
    let vy = Math.sin(ang) * rr;
    let wx = Math.random() * 1 - .5;
    let wy = Math.random() * 1 - .5;
    x += vx;
    y += vy;
    x += wx;
    y += wy;
    c.fillStyle = col;
    c.fillRect(x, y, 1, 1);
    life++;
    if (life > death) {
      if (a > 0) {
        branch(lidx, x, y, ang, a);
        branch(lidx, x, y, ang - Math.random() * .8 + .4, asf);
      }
      delete branchers[lidx][t.id];
    }
  };
  t.id = idx;
  if (!branchers[lidx]) branchers[lidx] = {};
  branchers[lidx][idx] = t;
  idx++;
  return t;
}

let lidx = 0;
function letter(ps) {
  c.fillStyle = bg;
  for (let i = 0; i < ps.length; i += 2) {
    c.fillRect(ps[i] - 3, ps[i + 1] - 3, 6, 6);
  }
  c.strokeStyle = 'white';
  c.beginPath();
  c.moveTo(ps[0], ps[1]);
  let branches = [];
  for (let i = 2; i < ps.length; i += 2) {
    if (Math.random() < .001) continue;
    c.lineTo(ps[i], ps[i + 1]);
    const dx = ps[i] - ps[i - 2];
    const dy = ps[i + 1] - ps[i - 1];
    let ang = Math.atan2(dy, dx) + Math.PI / 2;
    for (let j = 0; j < 3; j++) {
      if (Math.random() < .5) ang += Math.PI;
      branches.push([lidx, ps[i], ps[i + 1], ang]);
    }
  }
  c.stroke();
  for (let i = 0; i < branches.length; i++) {
    branch.apply(null, branches[i]);
  }
  lidx++;
}

canvas.addEventListener('pointerdown', e => {
  down = true;
  xys = [];
});
canvas.addEventListener('pointermove', e => {
  if (down) {
    c.fillStyle = 'red';
    c.fillRect(e.clientX, e.clientY, 2, 2);
    xys.push(e.clientX, e.clientY);
  }
});
window.addEventListener('pointerup', e => {
  if (down) {
    down = false;
    letter(xys);
    xys = [];
  }
});

/* ============ Knowledge Vault app ============ */

const cliData = [

title:"Miller",
content:"mlr --csv cat file.csv"
},
{
title:"jq",
content:"jq '.name' file.json"
},
{
title:"grep",
content:"grep -R 'password' ."
}
];

const netData = [
{
title:"Nmap",
content:"nmap -sV 192.168.1.1"
},
{
title:"Ping",
content:"ping google.com"
}
];

const linuxData = [
{
title:"Find",
content:"find / -name test.txt"
},
{
title:"lsblk",
content:"lsblk -f"
}
];

const webData = [
{
title:"Flexbox",
content:"display:flex;"
},
{
title:"Grid",
content:"display:grid;"
}
];

let z = 100;

function openWindow(title,data){

let win=document.createElement("div");
win.className="window";
win.style.left=260+Math.random()*200+"px";
win.style.top=100+Math.random()*100+"px";

win.innerHTML=`
<div class="titlebar">
<span>${title}</span>
<span class="close">✕</span>
</div>

<div class="content">
${data.map(item=>`
<div class="note">
<h3>${item.title}</h3>
<pre>${item.content}</pre>
</div>
`).join("")}
</div>
`;

document.body.appendChild(win);

win.querySelector(".close").onclick=()=>{
win.remove();
};

drag(win);

}

/* Drag */

function drag(el){

const title=el.querySelector(".titlebar");

let x=0,y=0,px=0,py=0;

title.onmousedown=(e)=>{

el.style.zIndex=++z;

px=e.clientX;
py=e.clientY;

document.onmousemove=(e)=>{

x=px-e.clientX;
y=py-e.clientY;

px=e.clientX;
py=e.clientY;

el.style.top=(el.offsetTop-y)+"px";
el.style.left=(el.offsetLeft-x)+"px";
};

document.onmouseup=()=>{
document.onmousemove=null;
};
};

}

</script>
