<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Vault</title>

<style>
:root{
  /* CHANGE ONLY THIS */
  --accent:#b890fc;

  --bg:#050505;
  --panel:#090909;

  --border:var(--accent);
  --text:#FFFFFF;
  --glow:var(--accent);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Consolas, monospace;
}
.sidebar{
  overflow-y:auto;
  scrollbar-width:thin;
}
body{
  background:#000;
  overflow:hidden;
  color:var(--text);
  height:100vh;
  position: relative;
}

/* Background Starfield Canvas */
#canvas {
  display: block;
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 1;
}

/* Click warp flash overlay */
#warp-flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 50%,
          rgba(245, 73, 39, 0) 30%,
          rgba(245, 73, 39, 0.3) 70%,
          rgba(150, 20, 10, 0.6) 100%);
  transition: opacity 0.08s ease-in;
  z-index: 2;
}

#warp-flash.on {
  opacity: 1;
  transition: opacity 0.08s ease-in;
}

#warp-flash.off {
  opacity: 0;
  transition: opacity 0.6s ease-out;
}

#hint {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(245, 73, 39, 0.45);
  font-family: 'Courier New', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  pointer-events: none;
  animation: fadehint 1s ease-out 3s forwards;
  z-index: 3;
}

@keyframes fadehint {
  to {
    opacity: 0;
  }
}

/* Sidebar */
.sidebar{
  position:fixed;
  left:10px;
  top:10px;
  bottom:10px;
  width:220px;
  background:rgba(0,0,0,.85);
  border:1px solid var(--border);
  padding:15px;
  z-index:5;
}

.logo{
  font-size:20px;
  margin-bottom:20px;
  font-weight:bold;
}

.menu button{
  width:100%;
  margin-bottom:8px;
  padding:10px;
  background:black;
  border:1px solid var(--border);
  color:var(--text);
  cursor:pointer;
}

.menu button:hover{
  box-shadow:0 0 15px var(--glow);
}

/* Top Bar */
.topbar{
  position:fixed;
  left:250px;
  right:20px;
  top:10px;
  height:60px;
  background:rgba(0,0,0,.8);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 20px;
  z-index:5;
}

/* Windows */
.window{
  position:absolute;
  background:rgba(0,0,0,.95);
  border:1px solid var(--border);
  box-shadow:0 0 15px rgba(245, 73, 39, 0.2);
  width:500px;
  height:350px;
  z-index:10;
}

.titlebar{
  height:35px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10px;
  border-bottom:1px solid var(--border);
  cursor:move;
}

.close{
  cursor:pointer;
}

.content{
  padding:15px;
  height:calc(100% - 35px);
  overflow:auto;
}

.note{
  margin-bottom:15px;
  padding:10px;
  border:1px solid rgba(245, 73, 39, 0.2);
}

.note h3{
  margin-bottom:10px;
}

pre{
  white-space:pre-wrap;
  color:#ffd38a;
}
</style>
</head>

<body>

<div class="sidebar">

<script>
/* Data Vault */
const cliData = [
  { title:"Miller", content:"mlr --csv cat file.csv" },
  { title:"jq", content:"jq '.name' file.json" },
  { title:"grep", content:"grep -R 'password' ." }
];

const netData = [
  { title:"Nmap", content:"nmap -sV 192.168.1.1" },
  { title:"Ping", content:"ping google.com" }
];

const linuxData = [
  { title:"Find", content:"find / -name test.txt" },
  { title:"lsblk", content:"lsblk -f" }
];

const webData = [
  { title:"Flexbox", content:"display:flex;" },
  { title:"Grid", content:"display:grid;" }
];

/* Window System */
let z = 100;

function openWindow(title, data){
  let win = document.createElement("div");
  win.className = "window";
  win.style.left = 260 + Math.random() * 200 + "px";
  win.style.top = 100 + Math.random() * 100 + "px";

  win.innerHTML = `
    <div class="titlebar">
      <span>${title}</span>
      <span class="close">✕</span>
    </div>
    <div class="content">
      ${data.map(item => `
        <div class="note">
          <h3>${item.title}</h3>
          <pre>${item.content}</pre>
        </div>
      `).join("")}
    </div>
  `;

  document.body.appendChild(win);

  win.style.zIndex = ++z;
  win.addEventListener('mousedown', () => {
    win.style.zIndex = ++z;
  });

  win.querySelector(".close").onclick = () => {
    win.remove();
  };

  drag(win);
}

/* Drag */
function drag(el){
  const title = el.querySelector(".titlebar");
  let x = 0, y = 0, px = 0, py = 0;

  title.onmousedown = (e) => {
    el.style.zIndex = ++z;
    px = e.clientX;
    py = e.clientY;

    document.onmousemove = (e) => {
      x = px - e.clientX;
      y = py - e.clientY;
      px = e.clientX;
      py = e.clientY;

      el.style.top = (el.offsetTop - y) + "px";
      el.style.left = (el.offsetLeft - x) + "px";
    };

    document.onmouseup = () => {
      document.onmousemove = null;
    };
  };
}

/* Starfield Engine */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const flash = document.getElementById('warp-flash');

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
const CX = () => W / 2;
const CY = () => H / 2;

window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

let targetSpeed = 5;
let speed = 5;
let warpBurst = 0;       
const MIN_SPD = 2;
const MAX_SPD = 45;

window.addEventListener('wheel', e => {
  if (!e.target.closest('.content') && !e.target.closest('.sidebar')) {
    targetSpeed = Math.max(MIN_SPD, Math.min(MAX_SPD, targetSpeed + e.deltaY * 0.04));
  }
}, { passive: true });

canvas.addEventListener('click', () => {
  warpBurst = 1.0;
  flash.className = 'on';
  setTimeout(() => { flash.className = 'off'; }, 100);
});

const BAND_ANGLE = 0.35; 
const BAND_WIDTH = H * 0.18;

function inMilkyWay(x, y) {
  const rx = (x - W / 2) * Math.cos(-BAND_ANGLE) - (y - H / 2) * Math.sin(-BAND_ANGLE);
  return Math.abs(rx) < BAND_WIDTH / 2;
}

const STAR_COUNT = 900;

class Star {
  constructor(reset = false) { 
    this.type = Math.random() > 0.5 ? 'red' : 'white';
    this.init(reset); 
  }

  init(reset = false) {
    if (Math.random() < 0.3) {
      const along = (Math.random() - 0.5) * Math.max(W, H) * 2;
      const perp = (Math.random() - 0.5) * BAND_WIDTH;
      this.sx = along * Math.cos(BAND_ANGLE) - perp * Math.sin(BAND_ANGLE) + W / 2;
      this.sy = along * Math.sin(BAND_ANGLE) + perp * Math.cos(BAND_ANGLE) + H / 2;
    } else {
      this.sx = (Math.random() - 0.5) * W * 2;
      this.sy = (Math.random() - 0.5) * H * 2;
    }
    this.z = reset ? Math.random() * W : W;
    this.pz = this.z;
    this.milky = inMilkyWay(this.sx + W / 2, this.sy + H / 2);
  }

  update(spd) {
    this.pz = this.z;
    this.z -= spd;
    if (this.z <= 1) { this.init(false); }
  }

  draw(spd) {
    const scale = W / 2;
    const sx = (this.sx / this.z) * scale + CX();
    const sy = (this.sy / this.z) * scale + CY();

    if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) return;

    const t = 1 - this.z / W;       
    const r = t * (this.milky ? 1.5 : 2.2);

    let hue, sat, lit;
    if (warpBurst > 0.3 || spd > 22) {
      // Warp speed flash effect (hybrid high energy)
      hue = 0; sat = 100; lit = 70 + t * 30;
    } else if (this.type === 'red') {
      // Bloody Red Space Particles
      hue = 0; sat = 95; lit = 40 + t * 30;
    } else {
      // Clean White Space Particles
      hue = 0; sat = 0; lit = 75 + t * 25;
    }

    const alpha = Math.min(1, t * 1.4 + 0.1);

    if (spd > 10 || warpBurst > 0.1) {
      const px = (this.sx / this.pz) * scale + CX();
      const py = (this.sy / this.pz) * scale + CY();
      const streakAlpha = alpha * Math.min(1, spd / 20) * (warpBurst > 0 ? 1.4 : 1);
      const grad = ctx.createLinearGradient(px, py, sx, sy);
      grad.addColorStop(0, `hsla(${hue},${sat}%,${lit}%,0)`);
      grad.addColorStop(1, `hsla(${hue},${sat}%,${lit}%,${Math.min(1, streakAlpha)})`);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(sx, sy);
      ctx.strokeStyle = grad;
      ctx.lineWidth = r * 0.9;
      ctx.stroke();
    }

    if (r > 0.3) {
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue},${sat}%,${lit}%,${alpha})`;
      ctx.fill();

      if (spd > 28 || warpBurst > 0.5) {
        const arm = r * 5;
        ctx.strokeStyle = `hsla(${hue},${sat}%,${lit}%,${alpha * 0.3})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(sx - arm, sy); ctx.lineTo(sx + arm, sy);
        ctx.moveTo(sx, sy - arm); ctx.lineTo(sx, sy + arm);
        ctx.stroke();
      }
    }
  }
}

const stars = Array.from({ length: STAR_COUNT }, () => new Star(true));

function animate() {
  const effectiveTarget = warpBurst > 0 ? MAX_SPD : targetSpeed;
  speed += (effectiveTarget - speed) * 0.05;
  warpBurst *= 0.94; 

  const trailAlpha = warpBurst > 0.2 ? 0.25 : Math.max(0.08, 1 - speed / 15);
  ctx.fillStyle = `rgba(0, 0, 0, ${trailAlpha})`;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    s.update(speed);
    s.draw(speed);
  }

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
