    html, body {

    .waves {

      z-index: 1; /* Keep behind the UI elements */

.sidebar{

}
    .waves::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0.5rem;
      height: 0.5rem;
      background: #160000;
      border-radius: 50%;
      transform: translate3d(calc(var(--x, -100px) - 50%), calc(var(--y, -100px) - 50%), 0);
      will-change: transform;
      pointer-events: none; /* Prevents the dot from blocking mouse events */
    }

    .waves-canvas {
      display: block;
      width: 100%;
      height: 100%;

    /* ==========================================================================
       2. INTERFACE UI STYLES (from demo_cleanbg.html)
       ========================================================================== */
    :root {
      /* CHANGE ONLY THIS */
      --accent:#b890fc;
      --bg:#050505;
      --panel:#090909;
      --border:var(--accent);
      --text:#FFFFFF;
      --glow:var(--accent);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Consolas, monospace;
    }

    body {
      color: var(--text);
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      left: 10px;
      top: 10px;
      bottom: 10px;
      width: 220px;
      background: rgba(0,0,0,.85);
      border: 1px solid var(--border);
      padding: 15px;
      z-index: 5;
    }

    .logo {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .menu button {
      width: 100%;
      margin-bottom: 8px;
      padding: 10px;
      background: black;
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
    }

    .menu button:hover {
      box-shadow: 0 0 15px var(--glow);
    }

    /* Top Bar */
    .topbar {
      position: fixed;
      left: 250px;
      right: 20px;
      top: 10px;
      height: 60px;
      background: rgba(0,0,0,.8);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      z-index: 5;
    }

    /* Windows */
    .window {
      position: absolute;
      background: rgba(0,0,0,.95);
      border: 1px solid var(--border);
      box-shadow: 0 0 15px rgba(94,255,247,.2);
      width: 500px;
      height: 350px;
      z-index: 10;
    }

    .titlebar {
      height: 35px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      cursor: move;
    }

    .close {
      cursor: pointer;
    }

    .content {
      padding: 15px;
      height: calc(100% - 35px);
      overflow: auto;
    }

    .note {
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid rgba(94,255,247,.2);
    }

    .note h3 {
      margin-bottom: 10px;
    }

    pre {
      white-space: pre-wrap;
      color: #ffd38a;
    }
  </style>

  <script>
    // ==========================================================================
    // MODULE A: PERLIN NOISE BACKGROUND LOGIC (from w.html)
    // ==========================================================================
    class Grad {
      constructor(x, y, z) {
        this.x = x;
        this.y = y;
        this.z = z;
      }
      dot2(x, y) {
        return this.x * x + this.y * y;
      }
    }

    class Noise {
      constructor(seed = 0) {
        this.grad3 = [
          new Grad(1, 1, 0), new Grad(-1, 1, 0), new Grad(1, -1, 0), new Grad(-1, -1, 0),
          new Grad(1, 0, 1), new Grad(-1, 0, 1), new Grad(1, 0, -1), new Grad(-1, 0, -1),
          new Grad(0, 1, 1), new Grad(0, -1, 1), new Grad(0, 1, -1), new Grad(0, -1, -1)
        ];
        this.p = [
          151, 160, 137, 91, 90, 15, 131, 13, 201, 95, 96, 53, 194, 233, 7, 225, 140, 36, 103, 30, 69, 142, 8, 99, 37, 240,
          21, 10, 23, 190, 6, 148, 247, 120, 234, 75, 0, 26, 197, 62, 94, 252, 219, 203, 117, 35, 11, 32, 57, 177, 33, 88,
          237, 149, 56, 87, 174, 20, 125, 136, 171, 168, 68, 175, 74, 165, 71, 134, 139, 48, 27, 166, 77, 146, 158, 231, 83,
          111, 229, 122, 60, 211, 133, 230, 220, 105, 92, 41, 55, 46, 245, 40, 244, 102, 143, 54, 65, 25, 63, 161, 1, 216,
          80, 73, 209, 76, 132, 187, 208, 89, 18, 169, 200, 196, 135, 130, 116, 188, 159, 86, 164, 100, 109, 198, 173, 186,
          3, 64, 52, 217, 226, 250, 124, 123, 5, 202, 38, 147, 118, 126, 255, 82, 85, 212, 207, 206, 59, 227, 47, 16, 58,
          17, 182, 189, 28, 42, 223, 183, 170, 213, 119, 248, 152, 2, 44, 154, 163, 70, 221, 153, 101, 155, 167, 43, 172, 9,
          129, 22, 39, 253, 19, 98, 108, 110, 79, 113, 224, 232, 178, 185, 112, 104, 218, 246, 97, 228, 251, 34, 242, 193,
          238, 210, 144, 12, 191, 179, 162, 241, 81, 51, 145, 235, 249, 14, 239, 107, 49, 192, 214, 31, 181, 199, 106, 157,
          184, 84, 204, 176, 115, 121, 50, 45, 127, 4, 150, 254, 138, 236, 205, 93, 222, 114, 67, 29, 24, 72, 243, 141, 128,
          195, 78, 66, 215, 61, 156, 180
        ];
        this.perm = new Array(512);
        this.gradP = new Array(512);
        this.seed(seed);
      }
      seed(seed) {
        if (seed > 0 && seed < 1) seed *= 65536;
        seed = Math.floor(seed);
        if (seed < 256) seed |= seed << 8;
        for (let i = 0; i < 256; i++) {
          let v = i & 1 ? this.p[i] ^ (seed & 255) : this.p[i] ^ ((seed >> 8) & 255);
          this.perm[i] = this.perm[i + 256] = v;
          this.gradP[i] = this.gradP[i + 256] = this.grad3[v % 12];
        }
      }
      fade(t) {
        return t * t * t * (t * (t * 6 - 15) + 10);
      }
      lerp(a, b, t) {
        return (1 - t) * a + t * b;
      }
      perlin2(x, y) {
        let X = Math.floor(x), Y = Math.floor(y);
        x -= X; y -= Y;
        X &= 255; Y &= 255;
        const n00 = this.gradP[X + this.perm[Y]].dot2(x, y);
        const n01 = this.gradP[X + this.perm[Y + 1]].dot2(x, y - 1);
        const n10 = this.gradP[X + 1 + this.perm[Y]].dot2(x - 1, y);
        const n11 = this.gradP[X + 1 + this.perm[Y + 1]].dot2(x - 1, y - 1);
        const u = this.fade(x);
        return this.lerp(this.lerp(n00, n10, u), this.lerp(n01, n11, u), this.fade(y));
      }
    }

    const config = {
      lineColor: "#ffffff",
      backgroundColor: "rgba(0, 0, 0, 1)",
      waveSpeedX: 0.0125,
      waveSpeedY: 0.01,
      waveAmpX: 40,
      waveAmpY: 20,
      friction: 0.9,
      tension: 0.01,
      maxCursorMove: 120,
      xGap: 12,
      yGap: 36
    };

    const container = document.getElementById('waves-container');
    const canvas = document.getElementById('waves-canvas');
    const ctx = canvas.getContext('2d');

    container.style.backgroundColor = config.backgroundColor;

    let bounding = { width: 0, height: 0, left: 0, top: 0 };
    const noiseEngine = new Noise(Math.random());
    let lines = [];
    let frameId = null;

    const mouse = {
      x: -10, y: 0, lx: 0, ly: 0, sx: 0, sy: 0, v: 0, vs: 0, a: 0, set: false
    };

    function setSize() {
      bounding = container.getBoundingClientRect();
      canvas.width = bounding.width;
      canvas.height = bounding.height;
    }

    function setLines() {
      const { width, height } = bounding;
      lines = [];
      const oWidth = width + 200, oHeight = height + 30;
      const { xGap, yGap } = config;
      const totalLines = Math.ceil(oWidth / xGap);
      const totalPoints = Math.ceil(oHeight / yGap);
      const xStart = (width - xGap * totalLines) / 2;
      const yStart = (height - yGap * totalPoints) / 2;

      for (let i = 0; i <= totalLines; i++) {
        const pts = [];
        for (let j = 0; j <= totalPoints; j++) {
          pts.push({
            x: xStart + xGap * i,
            y: yStart + yGap * j,
            wave: { x: 0, y: 0 },
            cursor: { x: 0, y: 0, vx: 0, vy: 0 }
          });
        }
        lines.push(pts);
      }
    }

    function movePoints(time) {
      const { waveSpeedX, waveSpeedY, waveAmpX, waveAmpY, friction, tension, maxCursorMove } = config;
      
      lines.forEach(pts => {
        pts.forEach(p => {
          const move = noiseEngine.perlin2((p.x + time * waveSpeedX) * 0.002, (p.y + time * waveSpeedY) * 0.0015) * 12;
          p.wave.x = Math.cos(move) * waveAmpX;
          p.wave.y = Math.sin(move) * waveAmpY;

          const dx = p.x - mouse.sx, dy = p.y - mouse.sy;
          const dist = Math.hypot(dx, dy);
          const l = Math.max(175, mouse.vs);
          
          if (dist < l) {
            const s = 1 - dist / l;
            const f = Math.cos(dist * 0.001) * s;
            p.cursor.vx += Math.cos(mouse.a) * f * l * mouse.vs * 0.00065;
            p.cursor.vy += Math.sin(mouse.a) * f * l * mouse.vs * 0.00065;
          }

          p.cursor.vx += (0 - p.cursor.x) * tension;
          p.cursor.vy += (0 - p.cursor.y) * tension;
          p.cursor.vx *= friction;
          p.cursor.vy *= friction;
          p.cursor.x += p.cursor.vx * 2;
          p.cursor.y += p.cursor.vy * 2;
          
          p.cursor.x = Math.min(maxCursorMove, Math.max(-maxCursorMove, p.cursor.x));
          p.cursor.y = Math.min(maxCursorMove, Math.max(-maxCursorMove, p.cursor.y));
        });
      });
    }

    function moved(point, withCursor = true) {
      const x = point.x + point.wave.x + (withCursor ? point.cursor.x : 0);
      const y = point.y + point.wave.y + (withCursor ? point.cursor.y : 0);
      return { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10 };
    }

    function drawLines() {
      const { width, height } = bounding;
      ctx.clearRect(0, 0, width, height);
      ctx.beginPath();
      ctx.strokeStyle = config.lineColor;
      ctx.lineWidth = 1;

      lines.forEach(points => {
        let p1 = moved(points[0], false);
        ctx.moveTo(p1.x, p1.y);
        points.forEach((p, idx) => {
          const isLast = idx === points.length - 1;
          p1 = moved(p, !isLast);
          const p2 = moved(points[idx + 1] || points[points.length - 1], !isLast);
          ctx.lineTo(p1.x, p1.y);
          if (isLast) ctx.moveTo(p2.x, p2.y);
        });
      });
      ctx.stroke();
    }

    function tick(t) {
      mouse.sx += (mouse.x - mouse.sx) * 0.1;
      mouse.sy += (mouse.y - mouse.sy) * 0.1;
      
      const dx = mouse.x - mouse.lx, dy = mouse.y - mouse.ly;
      const d = Math.hypot(dx, dy);
      mouse.v = d;
      mouse.vs += (d - mouse.vs) * 0.1;
      mouse.vs = Math.min(100, mouse.vs);
      mouse.lx = mouse.x;
      mouse.ly = mouse.y;
      mouse.a = Math.atan2(dy, dx);
      
      container.style.setProperty('--x', `${mouse.sx}px`);
      container.style.setProperty('--y', `${mouse.sy}px`);

      movePoints(t);
      drawLines();
      frameId = requestAnimationFrame(tick);
    }

    function updateMouse(clientX, clientY) {
      mouse.x = clientX - bounding.left;
      mouse.y = clientY - bounding.top;
      if (!mouse.set) {
        mouse.sx = mouse.x; mouse.sy = mouse.y;
        mouse.lx = mouse.x; mouse.ly = mouse.y;
        mouse.set = true;
      }
    }

    window.addEventListener('resize', () => {
      setSize();
      setLines();
    });

    window.addEventListener('mousemove', (e) => {
      updateMouse(e.clientX, e.clientY);
    });

    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      updateMouse(touch.clientX, touch.clientY);
    }, { passive: false });

    // Initial background boot-up sequence
    setSize();
    setLines();
    frameId = requestAnimationFrame(tick);


    // ==========================================================================
    // MODULE B: KNOWLEDGE VAULT DATA & SYSTEM LOGIC (from demo_cleanbg.html)
    // ==========================================================================
    const cliData = [
      { title:"Miller", content:"mlr --csv cat file.csv" },
      { title:"jq", content:"jq '.name' file.json" },
      { title:"grep", content:"grep -R 'password' ." }
    ];

    const netData = [
      { title:"Nmap", content:"nmap -sV 192.168.1.1" },
      { title:"Ping", content:"ping google.com" }
    ];

    const linuxData = [
      { title:"Find", content:"find / -name test.txt" },
      { title:"lsblk", content:"lsblk -f" }
    ];

    const webData = [
      { title:"Flexbox", content:"display:flex;" },
      { title:"Grid", content:"display:grid;" }
    ];

    let z = 100;

    function openWindow(title, data) {
      let win = document.createElement("div");
      win.className = "window";
      win.style.left = 260 + Math.random() * 200 + "px";
      win.style.top = 100 + Math.random() * 100 + "px";

      win.innerHTML = `
        <div class="titlebar">
          <span>${title}</span>
          <span class="close">✕</span>
        </div>
        <div class="content">
          ${data.map(item => `
            <div class="note">
              <h3>${item.title}</h3>
              <pre>${item.content}</pre>
            </div>
          `).join("")}
        </div>
      `;

      document.body.appendChild(win);

      win.querySelector(".close").onclick = () => {
        win.remove();
      };

      drag(win);
    }

    function drag(el) {
      const title = el.querySelector(".titlebar");
      let x = 0, y = 0, px = 0, py = 0;

      title.onmousedown = (e) => {
        el.style.zIndex = ++z;
        px = e.clientX;
        py = e.clientY;

        document.onmousemove = (e) => {
          x = px - e.clientX;
          y = py - e.clientY;
          px = e.clientX;
          py = e.clientY;
          el.style.top = (el.offsetTop - y) + "px";
          el.style.left = (el.offsetLeft - x) + "px";
        };

        document.onmouseup = () => {
          document.onmousemove = null;
        };
      };
    }
  </script>
